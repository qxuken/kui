# GitHub Actions: the public release. Pushing a `v*` tag runs
#
#   check ──┬── build (linux-x64, linux-arm64, darwin-arm64, win32-x64) ──┬── packs
#           │     each leg: the Node addon, the `kui` runner, libkui_ffi  ├── npm-stage ──┐
#           └─────────────────────────────────────────────────────────────┴───────────────┴── publish
#   smoke (macos-15, windows-2025) ─────────────────────────── packs, publish
#
# and `publish` puts the crates on crates.io and the ten npm packages on
# npmjs, while `packs` attaches to the tag's GitHub release:
#
#   kui-c-<version>.tar.gz, kui-odin-<version>.tar.gz
#       libkui_ffi for all four platforms, shared and static (the layout
#       is scripts/pack-ffi.nu's)
#   kui-<version>-<platform>.tar.gz (kui-<version>-win32-x64.zip)
#       the runner, one file `kui` (`kui.exe`) per platform
#       (scripts/pack-runner.nu, ADR 0068)
#   install.sh, install.ps1
#       scripts/install/: pick the platform's runner, check it against
#       SHA256SUMS, put it in ~/.kui/bin
#   SHA256SUMS
#       over every asset above, `<sha256>  <name>` a line
#
# `packs` and `publish` are siblings on purpose: a tag cannot be moved once
# crates.io holds its version, so a pack that fails must not hold the
# publish back, and a re-run of `packs` alone finishes it. `npm-stage`
# writes the npm packages from the build legs' artifacts
# (scripts/npm-platform-packages.nu) and installs them on linux-x64 as a
# user would, and `publish` puts up exactly those tarballs: the eight
# platform packages (@qxuken/kui-<platform>, the addon; @qxuken/kui-cli-
# <platform>, the runner) before the two that name them (@qxuken/kui,
# @qxuken/kui-cli), esbuild's shape.
#
# `workflow_dispatch` runs everything but the publishing steps, so the
# builds and the packs can be tried on a branch without a tag; the
# release's assets are then the run's `release-packs` artifact and the npm
# tarballs its `npm-packages` artifact.
#
# `check` is ci.yml itself, called: the whole check every push to main gets
# (fmt, clippy, the workspace tests on lavapipe, the C round, the Odin
# binding, the Node parity tests, the scene corpus, the book, the headless
# round), so nothing reaches crates.io or npmjs from a commit that fails
# any of it. Until alpha.68 this was fmt, clippy and the tests alone, and
# the full check was Forgejo's, started by hand; the repository lives on
# GitHub alone now, and Forgejo's registries take no new versions.
#
# `smoke` is smoke.yml, called with `blocking: true`: the workspace tests,
# every windowed example and the C round on macOS and Windows themselves,
# where `check` is Linux's. It runs beside `check` and `build` (its ~30
# minutes on Windows are the longest leg), and `packs` and `publish` wait
# for it, so a red macOS or Windows round leaves the tag movable with
# nothing on crates.io, npmjs or the release. Since alpha.69: alpha.67 and
# alpha.68 went out with these rounds run only on pushes to main, where
# they do not block.
#
# Each prebuild is built on the platform it targets, so no cross SDK is
# involved: GitHub's macOS runners carry Xcode, Windows runners MSVC, and
# the two Linux legs use cargo-zigbuild only to pin the glibc floor at 2.28,
# so the addon runs on distributions older than the runner's own Ubuntu.
# The arm64 leg runs on an arm64 runner (free for a public repository),
# which is what keeps multiarch ALSA headers out of the picture. There is
# no darwin-x64 leg: Intel Macs lost their prebuild after alpha.40 (the
# CHANGELOG says why), and build the addon from source.
#
# Secrets:
#   * CRATES_IO_TOKEN: a crates.io API token with publish-update on the
#     kui-* crates (publish-new too, for a crate not yet there).
#
# npmjs needs no secret: each of the ten packages trusts this workflow as
# its publisher (npmjs.com → the package's settings → Trusted Publisher:
# GitHub Actions, qxuken/kui, release.yml, with "Allow npm publish" and
# "Allow npm dist-tag"). The publish job asks GitHub for an OIDC token
# (`id-token: write`) and npm trades it for a short-lived publish token, so
# a tag goes live with no approval, and with provenance. A trusted
# publisher is set on a package that exists, so a package name npmjs has
# never held is published once by hand first (docs/releasing.md says how);
# `publish` checks all ten exist before it publishes anything. Until alpha.67 a stage-only
# NPM_TOKEN staged the version and a maintainer approved it by hand
# (scripts/npm-approve.nu, still the way to finish a version staged by hand).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep panic locations readable at a fraction of full debug
  # info's size; the test build of this workspace is large either way.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The Nushell the scripts are written against (scripts/*.nu), pinned like
  # every other tool here and in ci.yml.
  NU_VERSION: "0.116.1"
  # The Odin the packs' Odin half is verified with: ci.yml's pin, moved
  # with it.
  ODIN_VERSION: "dev-2026-10"
  CARGO_ZIGBUILD_VERSION: "0.23.3"
  ZIGLANG_VERSION: "0.17.0"
  # Trusted publishing wants npm 11.5.1 and Node 22.14; moving a dist-tag
  # over it wants npm 11.21.0.
  NPM_VERSION: "11.21.1"

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  smoke:
    uses: ./.github/workflows/smoke.yml
    with:
      blocking: true

  build:
    needs: check
    # The addon and libkui_ffi are built in one job, into one target dir:
    # the library reuses nearly all of the addon's tree. Measured on an M3
    # Pro, cold, 2026-10-22: the addon 180 crates in 47 s, the library
    # after it 18 more in 25 s. pack-ffi.nu's stripped debug info costs
    # nothing there, since cargo applies `strip` when it links.
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            prebuild: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            prebuild: linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            prebuild: darwin-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            prebuild: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          set -eu
          rustup update --no-self-update stable
          rustup default stable
          rustup target add "${{ matrix.target }}"

      # zig links the addon against glibc 2.28 (the `.2.28` suffix below)
      # whatever the runner's own glibc is; cargo-zigbuild and zig both come
      # as pip wheels for either Linux arch.
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
          python3 -m pip install --user --break-system-packages \
            "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" "ziglang==${ZIGLANG_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-zigbuild" --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: prebuild-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: prebuild-${{ matrix.target }}-

      - name: Build kui-node (Linux, glibc 2.28 floor)
        if: runner.os == 'Linux'
        run: cargo zigbuild -p kui-node --release --target "${{ matrix.target }}.2.28"

      - name: Build kui-node
        if: runner.os != 'Linux'
        shell: bash
        run: cargo build -p kui-node --release --target "${{ matrix.target }}"

      # What scripts/collect-prebuild.nu does, in the shell every runner
      # has, so the build legs need no Nushell: the cdylib goes to the
      # path packages/kui/native.cjs looks up, named after Node's
      # process.platform-process.arch.
      - name: Collect prebuild
        shell: bash
        run: |
          set -eu
          case "${{ matrix.target }}" in
            *windows*) src=kui_node.dll ;;
            *apple*)   src=libkui_node.dylib ;;
            *)         src=libkui_node.so ;;
          esac
          mkdir -p "packages/kui/prebuilds/${{ matrix.prebuild }}"
          cp "target/${{ matrix.target }}/release/$src" "packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node"
          ls -l "packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.prebuild }}
          path: packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node
          if-no-files-found: error

      # The C library, beside the addon and from the same target dir:
      # scripts/pack-ffi.nu builds this platform natively (through
      # cargo-zigbuild at glibc 2.28 on Linux, as the addon is) and lays
      # it out in target/pack/kui-ffi-<version>-<platform>/.
      - name: Install nu
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux)   triple="$(uname -m)-unknown-linux-gnu"; ext=tar.gz ;;
            macOS)   triple=aarch64-apple-darwin; ext=tar.gz ;;
            Windows) triple=x86_64-pc-windows-msvc; ext=zip ;;
          esac
          dir="nu-${NU_VERSION}-${triple}"
          mkdir -p "$RUNNER_TEMP/nu"
          curl -fL --retry 3 -o "$RUNNER_TEMP/nu.$ext" \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.${ext}"
          if [ "$ext" = zip ]; then
            unzip -q -j "$RUNNER_TEMP/nu.zip" '*nu.exe' -d "$RUNNER_TEMP/nu"
          else
            tar -xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP/nu" --strip-components=1 "${dir}/nu"
          fi
          echo "$RUNNER_TEMP/nu" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nu/nu" --version

      # The runner (ADR 0068), from the same target dir as the addon, which
      # shares most of its tree: through cargo-zigbuild at glibc 2.28 on
      # Linux, as the addon is, so the one binary runs on the same
      # distributions the addon does.
      #
      # `--allow-shlib-undefined` on the binary's own link: lld checks an
      # executable's shared libraries for symbols nothing defines, and the
      # runner's libasound.so asks for this Ubuntu's glibc (2.33-2.38),
      # which zig's 2.28 stubs do not have. The addon is a shared library
      # and never met it; alpha.68's first tag run did. On a user's machine
      # libasound comes from their distribution, built against their glibc.
      # `cargo-zigbuild rustc` (not `cargo zigbuild rustc`: `zigbuild` is its
      # build verb) passes the flag to the final link alone, so no dependency is
      # rebuilt for it.
      - name: Build the runner (Linux, glibc 2.28 floor)
        if: runner.os == 'Linux'
        run: |
          cargo-zigbuild rustc -p kui-cli --bin kui --release --target "${{ matrix.target }}.2.28" \
            -- -C link-arg=-Wl,--allow-shlib-undefined

      - name: Build the runner
        if: runner.os != 'Linux'
        shell: bash
        run: cargo build -p kui-cli --release --target "${{ matrix.target }}"

      # kui-<version>-<platform>.tar.gz, one file `kui` (a .zip of
      # `kui.exe` on Windows), in target/pack/runner/; and the binary
      # asked its version on the platform it is for, which is as far as a
      # runner without a display can run it.
      - name: Pack the runner
        shell: bash
        run: |
          set -eu
          exe=kui
          [ "$RUNNER_OS" = Windows ] && exe=kui.exe
          "target/${{ matrix.target }}/release/$exe" -V
          nu scripts/pack-runner.nu "${{ matrix.prebuild }}"

      - uses: actions/upload-artifact@v7
        with:
          name: kui-runner-${{ matrix.prebuild }}
          path: target/pack/runner/kui-*-${{ matrix.prebuild }}.*
          if-no-files-found: error
          compression-level: 0

      - name: Pack libkui_ffi
        shell: bash
        run: |
          set -eu
          zig=
          [ "$RUNNER_OS" = Linux ] && zig=--zig
          nu scripts/pack-ffi.nu --platforms "${{ matrix.prebuild }}" $zig

      # The pack linked and run on the platform it is for, as a user would
      # take it out of the release: the C counter and the Odin one, each
      # against the shared library and the static one, each --headless.
      # Not on Windows, which has no cc (pack-ffi.nu's `verify` says so).
      - name: Install Odin
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64)  asset=odin-linux-amd64 ;;
            Linux-aarch64) asset=odin-linux-arm64 ;;
            macOS-arm64)   asset=odin-macos-arm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fL --retry 3 \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/${asset}-${ODIN_VERSION}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "ODIN=$RUNNER_TEMP/odin/odin" >> "$GITHUB_ENV"
          echo "ODIN_ROOT=$RUNNER_TEMP/odin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/odin/odin" version

      - name: Verify the pack
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          nu scripts/pack-ffi.nu bundle --partial
          for t in target/pack/release/kui-*.tar.gz; do
            nu scripts/pack-ffi.nu verify "$t"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: kui-ffi-${{ matrix.prebuild }}
          path: target/pack/kui-ffi-*-${{ matrix.prebuild }}.tar.gz
          if-no-files-found: error
          # Already a tarball; zipping it again buys nothing.
          compression-level: 0

  # The four platforms' packs into the two release tarballs, checked once
  # more as shipped (linux-x64, on this runner), the four runners and the
  # install scripts beside them, one SHA256SUMS over everything, and all
  # of it attached to the tag's GitHub release. Not in `publish`'s way: see
  # the top of this file.
  packs:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    # The one job that writes to the repository: creating the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - name: Install Odin and ALSA
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fL --retry 3 \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "ODIN=$RUNNER_TEMP/odin/odin" >> "$GITHUB_ENV"
          echo "ODIN_ROOT=$RUNNER_TEMP/odin" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: kui-ffi-*
          path: target/pack
          merge-multiple: true

      - name: Bundle
        run: |
          set -eu
          cd target/pack
          for t in kui-ffi-*.tar.gz; do tar -xzf "$t"; done
          cd ../..
          nu scripts/pack-ffi.nu bundle
          for t in target/pack/release/kui-*.tar.gz; do
            nu scripts/pack-ffi.nu verify "$t"
          done
          ls -l target/pack/release

      # After `bundle`, which empties target/pack/release/ first.
      - uses: actions/download-artifact@v8
        with:
          pattern: kui-runner-*
          path: target/pack/release
          merge-multiple: true

      # SHA256SUMS over every asset (pack-ffi.nu's own covered the two
      # tarballs only), then the linux-x64 runner installed the way a user
      # installs it: install.sh against these files laid out as a mirror
      # (KUI_MIRROR=file://…, the release's v<version>/ layout, with the
      # latest.txt a mirror holds), and the installed binary run.
      - name: Runner assets
        run: |
          set -eu
          ver=$(nu -c 'open Cargo.toml | get workspace.package.version')
          for p in linux-x64 linux-arm64 darwin-arm64; do
            test -f "target/pack/release/kui-$ver-$p.tar.gz" || { echo "missing runner $p" >&2; exit 1; }
          done
          test -f "target/pack/release/kui-$ver-win32-x64.zip" || { echo "missing runner win32-x64" >&2; exit 1; }
          cp scripts/install/install.sh scripts/install/install.ps1 target/pack/release/
          nu scripts/pack-runner.nu sums target/pack/release
          mirror="$RUNNER_TEMP/mirror"
          mkdir -p "$mirror"
          ln -s "$PWD/target/pack/release" "$mirror/v$ver"
          echo "$ver" > "$mirror/latest.txt"
          KUI_MIRROR="file://$mirror" KUI_INSTALL_DIR="$RUNNER_TEMP/kui-bin" sh scripts/install/install.sh
          test "$("$RUNNER_TEMP/kui-bin/kui" -V)" = "kui $ver"
          ls -l target/pack/release

      - uses: actions/upload-artifact@v7
        with:
          name: release-packs
          path: target/pack/release/
          if-no-files-found: error
          compression-level: 0

      # Created here if the tag has no release yet, else the assets are
      # replaced, so a re-run of this job finishes what a failed one began.
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          files=(target/pack/release/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            pre=
            case "$tag" in *-*) pre=--prerelease ;; esac
            gh release create "$tag" "${files[@]}" --verify-tag $pre --title "$tag" \
              --notes "What changed is the CHANGELOG's section for ${tag#v}: https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md. The kui runner: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/install.sh | sh\` on macOS and Linux, \`irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/install.ps1 | iex\` on Windows, or the kui-${tag#v}-<platform> archives by hand (SHA256SUMS covers every asset). The C and Odin tarballs hold libkui_ffi for linux-x64, linux-arm64, darwin-arm64 and win32-x64, shared and static; README.md in each says how to link it. Rust is on crates.io, Node on npmjs (@qxuken/kui, and the runner as @qxuken/kui-cli)."
          fi

  # The ten npm packages, from the build legs' artifacts: the addon and the
  # runner each into a package per platform, and the two main packages
  # naming those four as exact-version optionalDependencies
  # (scripts/npm-platform-packages.nu). Then installed from the tarballs on
  # this runner (linux-x64) as a user installs them: the addon must load
  # out of @qxuken/kui-linux-x64 and `kui` must run out of
  # @qxuken/kui-cli-linux-x64. The other platforms' packages are not yet
  # on npmjs at this version; npm skips an optional dependency it cannot
  # fetch, which is what makes the install possible before the publish.
  npm-stage:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install nu and ALSA
        run: |
          set -eu
          sudo apt-get update
          # The addon and the runner link libasound.
          sudo apt-get install -y --no-install-recommends libasound2-dev
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - uses: actions/download-artifact@v8
        with:
          pattern: '{linux,darwin,win32}-*'
          path: ${{ runner.temp }}/addons

      - uses: actions/download-artifact@v8
        with:
          pattern: kui-runner-*
          path: ${{ runner.temp }}/runners
          merge-multiple: true

      - name: Stage
        run: |
          set -eu
          nu scripts/npm-platform-packages.nu --addons "$RUNNER_TEMP/addons" --runners "$RUNNER_TEMP/runners" --out dist/npm --pack
          ls -l dist/npm

      - name: Install as a user would
        run: |
          set -eu
          ver=$(nu -c 'open Cargo.toml | get workspace.package.version')
          npm_dir="$PWD/dist/npm"
          app="$RUNNER_TEMP/app"
          mkdir -p "$app"
          cd "$app"
          echo '{ "name": "app", "version": "1.0.0", "private": true }' > package.json
          npm install --no-audit --no-fund \
            "$npm_dir/qxuken-kui-$ver.tgz" "$npm_dir/qxuken-kui-linux-x64-$ver.tgz" \
            "$npm_dir/qxuken-kui-cli-$ver.tgz" "$npm_dir/qxuken-kui-cli-linux-x64-$ver.tgz"
          # Which file the addon was loaded from, as the process says.
          node -e '
            import("@qxuken/kui").then((m) => {
              const libs = process.report.getReport().sharedObjects.filter((s) => s.endsWith("kui_node.node"));
              console.log(Object.keys(m).length, "exports from", libs);
              if (!libs.some((s) => s.includes("/node_modules/@qxuken/kui-linux-x64/"))) process.exit(1);
            });
          '
          test "$(npx --no-install kui -V)" = "kui $ver"
          node -p 'require("@qxuken/kui-cli").path'

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist/npm/*.tgz
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [check, smoke, build, npm-stage]
    # Only a tag publishes; a manual run stops at the builds and the packs.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # id-token is npm's trusted publishing: the OIDC token npmjs trades for
    # a publish token. It is asked for here only, never workflow-wide.
    permissions:
      contents: read
      id-token: write
    env:
      # cargo reads crates.io's token from CARGO_REGISTRY_TOKEN.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      NPMJS_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node 22.14 or newer, which the image's own
      # Node is not promised to be; setup-node's also installs into a
      # prefix the runner owns, so `npm install -g` needs no sudo. No
      # cache: nothing restored from one should reach a publish.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # The repository's scripts are Nushell; the release tarball runs on
      # the runner as it is.
      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - name: Install toolchain
        run: |
          set -eu
          sudo apt-get update
          # The crates' verify builds compile kui-native, which links ALSA.
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
          rustup update --no-self-update stable
          rustup default stable
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CRATES_IO_TOKEN secret is not set" >&2; exit 1; }
          npm install -g "npm@${NPM_VERSION}"
          node --version
          npm --version

      # `cargo publish` verifies each crate by building the packaged tarball
      # under target/package against the registry copies of its dependencies;
      # keeping that dir and the registry cache makes later releases quick.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/package
          key: publish-${{ hashFiles('Cargo.lock') }}
          restore-keys: publish-

      - name: Tag matches the manifests
        run: nu scripts/check-version.nu "${GITHUB_REF_NAME#v}"

      # Every artifact the pattern matches lands in <path>/<artifact
      # name>/, which is exactly the prebuilds layout. The pattern is what
      # keeps the kui-ffi-* packs and the kui-runner-* assets out.
      - uses: actions/download-artifact@v8
        with:
          pattern: '{linux,darwin,win32}-*'
          path: packages/kui/prebuilds

      # No target dir exists in this job, so native.cjs must find the addon
      # under prebuilds/ (its fallback for a hand-staged package) - the
      # parity tests then exercise the shipped binary. What is published is
      # npm-stage's tarballs, which carry the same files.
      - name: Verify the shipped addons
        run: |
          set -eu
          ls -lR packages/kui/prebuilds
          for p in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            test -f "packages/kui/prebuilds/$p/kui_node.node" || { echo "missing prebuild $p" >&2; exit 1; }
          done
          cd packages/kui
          npm test

      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/npm

      # A trusted publisher can only be attached to a package npmjs already
      # holds, so a name never published (a new platform, say) cannot go
      # out from here: it is published once by hand, then given this
      # workflow as its publisher (docs/releasing.md). Asked before the
      # crates, so a missing one stops the release while nothing is out
      # and the tag can still move.
      - name: npm packages exist on npmjs
        run: |
          set -eu
          missing=
          for n in kui kui-cli kui-linux-x64 kui-linux-arm64 kui-darwin-arm64 kui-win32-x64 \
                   kui-cli-linux-x64 kui-cli-linux-arm64 kui-cli-darwin-arm64 kui-cli-win32-x64; do
            # The dist-tags, not `npm view`: the packument it reads is
            # cached and answers 404 for minutes after a first publish.
            if ! npm dist-tag ls "@qxuken/$n" --registry "$NPMJS_REGISTRY" 2>/dev/null | grep -q '^latest: '; then
              missing="$missing @qxuken/$n"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::not on npmjs yet:$missing - run 'nu scripts/npm-bootstrap.nu --trust' from a login on npmjs (placeholders, then this workflow as each one's trusted publisher; docs/releasing.md), then re-run this job"
            exit 1
          fi

      # In dependency order; a crate crates.io already holds at this version
      # is skipped, so re-running a job that failed partway finishes it.
      - name: cargo publish (crates.io)
        run: nu scripts/publish-crates.nu crates-io

      # Published live, through trusted publishing (see the top of this
      # file): npm finds the OIDC environment itself, takes no token and
      # attaches provenance. npm-stage's tarballs, the eight platform
      # packages first, so that @qxuken/kui and @qxuken/kui-cli never name
      # a version npmjs does not hold. Each goes out under its dist-tag
      # (`alpha` for a prerelease, `latest` for a plain version), then
      # scripts/npm-approve.nu's `latest` rule: a prerelease also takes
      # `latest` when it sorts highest among the versions npmjs holds, so a
      # bare `npm install @qxuken/kui` resolves, and a stable release's
      # `latest` is never taken back by an alpha after it. A re-run finds
      # the published ones live and only settles their tags.
      #
      # A version staged by hand (`npm stage publish`, the fallback in
      # docs/releasing.md) holds its slot and makes the publish fail: approve
      # it (npm-approve.nu) or reject it. `npm stage list` cannot tell from
      # here, since the stage commands take no OIDC.
      - name: npm publish (npmjs)
        run: |
          set -eu
          ver=$(node -p 'require("./packages/kui/package.json").version')
          tag=latest
          case "$ver" in *-*) tag="${ver#*-}"; tag="${tag%%.*}";; esac
          NPM_ROOT="$(npm root -g)"
          publish_one() {
            name="$1"
            tgz="$2"
            test -f "$tgz" || { echo "missing $tgz" >&2; return 1; }
            if [ "$(npm view "$name@$ver" version --registry "$NPMJS_REGISTRY" 2>/dev/null || true)" = "$ver" ]; then
              echo "$name@$ver is already live on npmjs"
            else
              npm publish "$tgz" --registry "$NPMJS_REGISTRY" --tag "$tag" --access public
            fi
            [ "$tag" = latest ] && return 0
            # Read off the dist-tags, not `npm view`'s cached packument, which
            # can trail a publish by minutes (npm-approve.nu says how that
            # was found); the new version is added to the list for the same
            # reason.
            latest=$(npm dist-tag ls "$name" --registry "$NPMJS_REGISTRY" | sed -n 's/^latest: //p')
            if [ "$latest" = "$ver" ]; then
              echo "$name: latest is $ver already"
              return 0
            fi
            versions=$(npm view "$name" versions --json --registry "$NPMJS_REGISTRY")
            highest=$(VERSIONS="$versions" VER="$ver" NPM_ROOT="$NPM_ROOT" node -e '
              const semver = require(require.resolve("semver", { paths: [process.env.NPM_ROOT + "/npm/node_modules"] }));
              const all = [].concat(JSON.parse(process.env.VERSIONS), process.env.VER).filter((v) => semver.valid(v));
              process.stdout.write(all.sort(semver.rcompare)[0]);
            ')
            if [ "$highest" != "$ver" ]; then
              echo "$name: latest left alone: $highest sorts above $ver (latest is ${latest:-unset})"
              return 0
            fi
            # A refused tag does not stop the rest: the versions go up, and
            # the step fails at the end naming what is left. alpha.68's
            # stopped at the first platform package, whose trusted publisher
            # had no "Allow npm dist-tag", with nine packages unpublished.
            if ! npm dist-tag add "$name@$ver" latest --registry "$NPMJS_REGISTRY"; then
              echo "::warning::$name@$ver is live but its latest tag was refused; tick \"Allow npm dist-tag\" on its trusted publisher (npmjs.com), then: npm dist-tag add $name@$ver latest"
              untagged="$untagged $name"
              return 0
            fi
            npm dist-tag ls "$name" --registry "$NPMJS_REGISTRY"
          }
          untagged=
          for p in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            publish_one "@qxuken/kui-$p" "dist/npm/qxuken-kui-$p-$ver.tgz"
            publish_one "@qxuken/kui-cli-$p" "dist/npm/qxuken-kui-cli-$p-$ver.tgz"
          done
          publish_one "@qxuken/kui" "dist/npm/qxuken-kui-$ver.tgz"
          publish_one "@qxuken/kui-cli" "dist/npm/qxuken-kui-cli-$ver.tgz"
          if [ -n "$untagged" ]; then
            echo "::error::published, but latest still names an older version on:$untagged"
            exit 1
          fi
