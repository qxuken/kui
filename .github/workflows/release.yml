# GitHub Actions: the public release. Pushing a `v*` tag runs
#
#   check ──┬── build (linux-x64, linux-arm64, darwin-arm64, win32-x64) ──┬── packs
#           └──────────────────────────────────────────────────────────┴── publish
#
# and `publish` puts the crates on crates.io and the npm package on npmjs,
# while `packs` attaches the C and Odin tarballs to the tag's GitHub
# release: kui-c-<version>.tar.gz and kui-odin-<version>.tar.gz, each with
# libkui_ffi for all four platforms, shared and static (the layout is
# scripts/pack-ffi.nu's). The two are siblings on purpose: a tag cannot be
# moved once crates.io holds its version, so a pack that fails must not
# hold the publish back, and a re-run of `packs` alone finishes it.
#
# `workflow_dispatch` runs everything but the two publishing steps, so the
# builds and the packs can be tried on a branch without a tag; the packs
# are then the run's `release-packs` artifact. The Forgejo pipeline (.forgejo/workflows/ci.yml) is the other half
# of a release, started by hand since alpha.66: it checks the tag in full
# (the C round, the Node parity tests, the scene corpus, the book) and
# publishes the crates to the Forgejo cargo registry once crates.io holds
# them. The npm package reaches
# the Forgejo npm registry by hand (scripts/release-local.nu; see
# docs/releasing.md).
#
# `check` here is the fast half of Forgejo's: fmt, clippy and the workspace
# tests, so nothing reaches crates.io from a commit that fails them. It is
# not a second CI; pull requests and pushes to main are Forgejo's.
#
# Each prebuild is built on the platform it targets, so no cross SDK is
# involved: GitHub's macOS runners carry Xcode, Windows runners MSVC, and
# the two Linux legs use cargo-zigbuild only to pin the glibc floor at 2.28,
# so the addon runs on distributions older than the runner's own Ubuntu.
# The arm64 leg runs on an arm64 runner (free for a public repository),
# which is what keeps multiarch ALSA headers out of the picture. There is
# no darwin-x64 leg: Intel Macs lost their prebuild after alpha.40 (the
# CHANGELOG says why), and build the addon from source.
#
# Secrets:
#   * CRATES_IO_TOKEN: a crates.io API token with publish-update on the
#     kui-* crates (publish-new too, for a crate not yet there).
#
# npmjs needs no secret: @qxuken/kui trusts this workflow as its publisher
# (npmjs.com → the package's settings → Trusted Publisher: GitHub Actions,
# qxuken/kui, release.yml, with "Allow npm publish" and "Allow npm
# dist-tag"). The publish job asks GitHub for an OIDC token (`id-token:
# write`) and npm trades it for a short-lived publish token, so a tag goes
# live with no approval, and with provenance. Until alpha.67 a stage-only
# NPM_TOKEN staged the version and a maintainer approved it by hand
# (scripts/npm-approve.nu, still the way to finish a version staged by hand).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Line tables keep panic locations readable at a fraction of full debug
  # info's size; the test build of this workspace is large either way.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The Nushell the scripts are written against (scripts/*.nu), pinned like
  # every other tool here and in the Forgejo workflow.
  NU_VERSION: "0.116.1"
  # The Odin the packs' Odin half is verified with: the Forgejo workflow's
  # pin (.forgejo/workflows/ci.yml), moved with it.
  ODIN_VERSION: "dev-2026-10"
  CARGO_ZIGBUILD_VERSION: "0.23.3"
  ZIGLANG_VERSION: "0.17.0"
  # Trusted publishing wants npm 11.5.1 and Node 22.14; moving a dist-tag
  # over it wants npm 11.21.0.
  NPM_VERSION: "11.21.1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # A hosted runner has about 14 GB free and this workspace's test
      # build does not fit beside the toolchains the image ships that this
      # job never uses (.NET, Android, Haskell, CodeQL). Removing them is
      # the usual answer and takes under a minute.
      - name: Free disk space
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install system deps
        run: |
          set -eu
          sudo apt-get update
          # ALSA headers: the runner crate's audio backend (kira/cpal) links
          # libasound on Linux; the font is for the text tests, which
          # measure real glyphs.
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core pkg-config libasound2-dev
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy
          cargo --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ hashFiles('Cargo.lock') }}
          restore-keys: check-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    needs: check
    # The addon and libkui_ffi are built in one job, into one target dir:
    # the library reuses nearly all of the addon's tree. Measured on an M3
    # Pro, cold, 2026-10-22: the addon 180 crates in 47 s, the library
    # after it 18 more in 25 s. pack-ffi.nu's stripped debug info costs
    # nothing there, since cargo applies `strip` when it links.
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            prebuild: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            prebuild: linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            prebuild: darwin-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            prebuild: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          set -eu
          rustup update --no-self-update stable
          rustup default stable
          rustup target add "${{ matrix.target }}"

      # zig links the addon against glibc 2.28 (the `.2.28` suffix below)
      # whatever the runner's own glibc is; cargo-zigbuild and zig both come
      # as pip wheels for either Linux arch.
      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
          python3 -m pip install --user --break-system-packages \
            "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" "ziglang==${ZIGLANG_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cargo-zigbuild" --version

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: prebuild-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: prebuild-${{ matrix.target }}-

      - name: Build kui-node (Linux, glibc 2.28 floor)
        if: runner.os == 'Linux'
        run: cargo zigbuild -p kui-node --release --target "${{ matrix.target }}.2.28"

      - name: Build kui-node
        if: runner.os != 'Linux'
        shell: bash
        run: cargo build -p kui-node --release --target "${{ matrix.target }}"

      # What scripts/collect-prebuild.nu does, in the shell every runner
      # has, so the build legs need no Nushell: the cdylib goes to the
      # path packages/kui/native.cjs looks up, named after Node's
      # process.platform-process.arch.
      - name: Collect prebuild
        shell: bash
        run: |
          set -eu
          case "${{ matrix.target }}" in
            *windows*) src=kui_node.dll ;;
            *apple*)   src=libkui_node.dylib ;;
            *)         src=libkui_node.so ;;
          esac
          mkdir -p "packages/kui/prebuilds/${{ matrix.prebuild }}"
          cp "target/${{ matrix.target }}/release/$src" "packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node"
          ls -l "packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.prebuild }}
          path: packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node
          if-no-files-found: error

      # The C library, beside the addon and from the same target dir:
      # scripts/pack-ffi.nu builds this platform natively (through
      # cargo-zigbuild at glibc 2.28 on Linux, as the addon is) and lays
      # it out in target/pack/kui-ffi-<version>-<platform>/.
      - name: Install nu
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS" in
            Linux)   triple="$(uname -m)-unknown-linux-gnu"; ext=tar.gz ;;
            macOS)   triple=aarch64-apple-darwin; ext=tar.gz ;;
            Windows) triple=x86_64-pc-windows-msvc; ext=zip ;;
          esac
          dir="nu-${NU_VERSION}-${triple}"
          mkdir -p "$RUNNER_TEMP/nu"
          curl -fL --retry 3 -o "$RUNNER_TEMP/nu.$ext" \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.${ext}"
          if [ "$ext" = zip ]; then
            unzip -q -j "$RUNNER_TEMP/nu.zip" '*nu.exe' -d "$RUNNER_TEMP/nu"
          else
            tar -xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP/nu" --strip-components=1 "${dir}/nu"
          fi
          echo "$RUNNER_TEMP/nu" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nu/nu" --version

      - name: Pack libkui_ffi
        shell: bash
        run: |
          set -eu
          zig=
          [ "$RUNNER_OS" = Linux ] && zig=--zig
          nu scripts/pack-ffi.nu --platforms "${{ matrix.prebuild }}" $zig

      # The pack linked and run on the platform it is for, as a user would
      # take it out of the release: the C counter and the Odin one, each
      # against the shared library and the static one, each --headless.
      # Not on Windows, which has no cc (pack-ffi.nu's `verify` says so).
      - name: Install Odin
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64)  asset=odin-linux-amd64 ;;
            Linux-aarch64) asset=odin-linux-arm64 ;;
            macOS-arm64)   asset=odin-macos-arm64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fL --retry 3 \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/${asset}-${ODIN_VERSION}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "ODIN=$RUNNER_TEMP/odin/odin" >> "$GITHUB_ENV"
          echo "ODIN_ROOT=$RUNNER_TEMP/odin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/odin/odin" version

      - name: Verify the pack
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          nu scripts/pack-ffi.nu bundle --partial
          for t in target/pack/release/kui-*.tar.gz; do
            nu scripts/pack-ffi.nu verify "$t"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: kui-ffi-${{ matrix.prebuild }}
          path: target/pack/kui-ffi-*-${{ matrix.prebuild }}.tar.gz
          if-no-files-found: error
          # Already a tarball; zipping it again buys nothing.
          compression-level: 0

  # The four platforms' packs into the two release tarballs, checked once
  # more as shipped (linux-x64, on this runner), and attached to the tag's
  # GitHub release. Not in `publish`'s way: see the top of this file.
  packs:
    needs: build
    runs-on: ubuntu-24.04
    # The one job that writes to the repository: creating the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - name: Install Odin and ALSA
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev
          mkdir -p "$RUNNER_TEMP/odin"
          curl -fL --retry 3 \
            "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/odin" --strip-components=1
          echo "ODIN=$RUNNER_TEMP/odin/odin" >> "$GITHUB_ENV"
          echo "ODIN_ROOT=$RUNNER_TEMP/odin" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          pattern: kui-ffi-*
          path: target/pack
          merge-multiple: true

      - name: Bundle
        run: |
          set -eu
          cd target/pack
          for t in kui-ffi-*.tar.gz; do tar -xzf "$t"; done
          cd ../..
          nu scripts/pack-ffi.nu bundle
          for t in target/pack/release/kui-*.tar.gz; do
            nu scripts/pack-ffi.nu verify "$t"
          done
          ls -l target/pack/release

      - uses: actions/upload-artifact@v7
        with:
          name: release-packs
          path: target/pack/release/
          if-no-files-found: error
          compression-level: 0

      # Created here if the tag has no release yet, else the assets are
      # replaced, so a re-run of this job finishes what a failed one began.
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          files=(target/pack/release/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            pre=
            case "$tag" in *-*) pre=--prerelease ;; esac
            gh release create "$tag" "${files[@]}" --verify-tag $pre --title "$tag" \
              --notes "What changed is the CHANGELOG's section for ${tag#v}: https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/CHANGELOG.md. The C and Odin tarballs hold libkui_ffi for linux-x64, linux-arm64, darwin-arm64 and win32-x64, shared and static; README.md in each says how to link it. Rust is on crates.io, Node on npmjs (@qxuken/kui)."
          fi

  publish:
    needs: [check, build]
    # Only a tag publishes; a manual run stops at the builds and the packs.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # id-token is npm's trusted publishing: the OIDC token npmjs trades for
    # a publish token. It is asked for here only, never workflow-wide.
    permissions:
      contents: read
      id-token: write
    env:
      # cargo reads crates.io's token from CARGO_REGISTRY_TOKEN.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
      NPMJS_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs Node 22.14 or newer, which the image's own
      # Node is not promised to be; setup-node's also installs into a
      # prefix the runner owns, so `npm install -g` needs no sudo. No
      # cache: nothing restored from one should reach a publish.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      # The repository's scripts are Nushell; the release tarball runs on
      # the runner as it is.
      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - name: Install toolchain
        run: |
          set -eu
          sudo apt-get update
          # The crates' verify builds compile kui-native, which links ALSA.
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev
          rustup update --no-self-update stable
          rustup default stable
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CRATES_IO_TOKEN secret is not set" >&2; exit 1; }
          npm install -g "npm@${NPM_VERSION}"
          node --version
          npm --version

      # `cargo publish` verifies each crate by building the packaged tarball
      # under target/package against the registry copies of its dependencies;
      # keeping that dir and the registry cache makes later releases quick.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/package
          key: publish-${{ hashFiles('Cargo.lock') }}
          restore-keys: publish-

      - name: Tag matches the manifests
        run: nu scripts/check-version.nu "${GITHUB_REF_NAME#v}"

      # Every artifact the pattern matches lands in <path>/<artifact
      # name>/, which is exactly the prebuilds layout. The pattern is what
      # keeps the kui-ffi-* packs out: prebuilds/ is in the npm package.
      - uses: actions/download-artifact@v8
        with:
          pattern: '{linux,darwin,win32}-*'
          path: packages/kui/prebuilds

      # No target dir exists in this job, so native.cjs must find the addon
      # under prebuilds/ - the parity tests then exercise the shipped binary.
      - name: Verify the bundled prebuilds
        run: |
          set -eu
          ls -lR packages/kui/prebuilds
          for p in linux-x64 linux-arm64 darwin-arm64 win32-x64; do
            test -f "packages/kui/prebuilds/$p/kui_node.node" || { echo "missing prebuild $p" >&2; exit 1; }
          done
          cd packages/kui
          npm test
          npm pack --dry-run

      # In dependency order; a crate crates.io already holds at this version
      # is skipped, so re-running a job that failed partway finishes it.
      - name: cargo publish (crates.io)
        run: nu scripts/publish-crates.nu crates-io

      # Published live, through trusted publishing (see the top of this
      # file): npm finds the OIDC environment itself, takes no token and
      # attaches provenance. The version goes out under its dist-tag
      # (`alpha` for a prerelease, `latest` for a plain version), then
      # scripts/npm-approve.nu's `latest` rule: a prerelease also takes
      # `latest` when it sorts highest among the versions npmjs holds, so a
      # bare `npm install @qxuken/kui` resolves, and a stable release's
      # `latest` is never taken back by an alpha after it. A re-run finds
      # the version live and only settles the tag.
      #
      # A version staged by hand (`npm stage publish`, the fallback in
      # docs/releasing.md) holds its slot and makes the publish fail: approve
      # it (npm-approve.nu) or reject it. `npm stage list` cannot tell from
      # here, since the stage commands take no OIDC.
      - name: npm publish (npmjs)
        run: |
          set -eu
          ver=$(node -p 'require("./packages/kui/package.json").version')
          tag=latest
          case "$ver" in *-*) tag="${ver#*-}"; tag="${tag%%.*}";; esac
          cd packages/kui
          if [ "$(npm view "@qxuken/kui@$ver" version --registry "$NPMJS_REGISTRY" 2>/dev/null || true)" = "$ver" ]; then
            echo "@qxuken/kui@$ver is already live on npmjs"
          else
            npm publish --registry "$NPMJS_REGISTRY" --tag "$tag" --access public
          fi
          [ "$tag" = latest ] && exit 0
          # Read off the dist-tags, not `npm view`'s cached packument, which
          # can trail a publish by minutes (npm-approve.nu says how that
          # was found); the new version is added to the list for the same
          # reason.
          latest=$(npm dist-tag ls @qxuken/kui --registry "$NPMJS_REGISTRY" | sed -n 's/^latest: //p')
          if [ "$latest" = "$ver" ]; then
            echo "latest is $ver already"
            exit 0
          fi
          versions=$(npm view @qxuken/kui versions --json --registry "$NPMJS_REGISTRY")
          highest=$(VERSIONS="$versions" VER="$ver" NPM_ROOT="$(npm root -g)" node -e '
            const semver = require(require.resolve("semver", { paths: [process.env.NPM_ROOT + "/npm/node_modules"] }));
            const all = [].concat(JSON.parse(process.env.VERSIONS), process.env.VER).filter((v) => semver.valid(v));
            process.stdout.write(all.sort(semver.rcompare)[0]);
          ')
          if [ "$highest" != "$ver" ]; then
            echo "latest left alone: $highest sorts above $ver (latest is ${latest:-unset})"
            exit 0
          fi
          npm dist-tag add "@qxuken/kui@$ver" latest --registry "$NPMJS_REGISTRY"
          npm dist-tag ls @qxuken/kui --registry "$NPMJS_REGISTRY"
