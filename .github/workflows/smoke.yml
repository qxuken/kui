# Native platform coverage on GitHub's macOS and Windows runners: every push
# to main, and by hand. Non-blocking.
#
# What it buys over ci.yml's Linux check is that the platform code is
# compiled by the platform's own toolchain, linked against the real SDK, and
# the workspace tests are executed on the machine the code was written for
# (the corpus and text tests are worth re-running on a second set of system
# fonts, too). Then the two rounds `cargo test` never reaches:
#
#   * the windowed round (`cargo run -p kui-devtools --bin smoke --
#     --windowed`), which opens every windowed example for 120 frames on
#     the runner's own adapter - the layer where three Windows crashes were
#     found in one round on 2026-09-08 that every headless test passed;
#   * the C round (`cbuild --run`) on the platform's own compiler: on
#     Windows an MSVC-ABI one, an import library at each link and no rpath,
#     where `CExtension::open` refused every path there had ever been until
#     2026-09-08 (backlog W6).
#
# What it does not buy is behavioural coverage of the platform chrome or the
# AccessKit bridge: neither windows_nc.rs nor access_bridge.rs has a test to
# run, and scripts/ax-audit.swift needs a TCC grant no ephemeral runner can
# hold (docs/releasing.md).
#
# Its own workflow, not two more jobs in ci.yml: it shares nothing with what
# makes `check` expensive, it is on no release path, and a red here should
# not read as a red check. `continue-on-error` keeps a run green while the
# rounds find their footing on hosted runners - neither has a GPU, so the
# windowed round draws on whatever software adapter the platform offers, if
# any - and each round runs even when the one before it failed, so one run
# says everything. Make it blocking once it has been green for a while.
#
# The cargo cache holds the registry and nothing else: the repository's
# caches share 10 GB, and two more target dirs would push ci.yml's and
# release.yml's out. A cold build on a hosted runner is the price.
name: smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        shell: bash
        run: |
          set -eu
          rustup update --no-self-update stable
          rustup default stable
          cargo --version

      - name: Cache the cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: smoke-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: smoke-registry-${{ runner.os }}-

      # `--no-fail-fast`, as ci.yml's: one red suite would hide the rest.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The dev profile, the one the test step just built the examples in,
      # so this is a fingerprint check and not a second compile of the GUI
      # stack. One window at a time: the default of eight at once, cascaded,
      # was measured on a Mac with a display, not on a runner.
      # Bounded: on windows-2025, with no GPU, the round took 52 minutes
      # the first time it passed, and a hang would hold the runner for the
      # job's six hours.
      - name: Smoke the examples in a window
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        run: cargo run -p kui-devtools --bin smoke -- --windowed --jobs 1

      # Needs a C compiler: Xcode's clang on macOS, Visual Studio's `cl` or
      # LLVM's `clang-cl` on Windows; the tool says so and fails if it finds
      # neither. It covers C as the host, C on both sides through
      # kui_ctx_add_extension, both Windows plugin shapes, and the
      # kui_ext_abi-less mutant that has to be refused for the right reason.
      - name: Build and run the C examples
        if: ${{ !cancelled() }}
        run: cargo run -p kui-devtools --bin cbuild -- --run
