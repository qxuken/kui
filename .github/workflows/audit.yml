# RustSec advisories against Cargo.lock, kept out of ci.yml on purpose.
#
# `cargo audit` reads the lockfile and nothing else: no target dir, no fonts,
# no Node, no conformance report. Folding it into ci.yml's `check` would hang
# a job that finishes in a minute off one that builds the whole workspace. It
# is also the one check here whose result can change without anyone pushing
# a commit - an advisory is published against code that has not moved -
# which is why this workflow has a schedule and ci.yml does not. A weekly run
# on main is the part that actually earns its keep; the push and
# pull_request triggers just catch a lockfile change at the moment it is
# made.
#
# It runs with `--deny warnings`, so an unmaintained, unsound or yanked crate
# fails the job the same as a vulnerability does. The escape hatch is
# .cargo/audit.toml: an ignore entry there, with a comment saying what pulls
# the crate in and what would let us delete the line - the ignore list is the
# record of what we have decided to live with.
#
# The yanked half is back since the move to GitHub: on Forgejo's runner it
# was `--no-yanked`, because one sparse-index request per crate timed out
# there and a timed-out lookup is not a warning (run 141 printed 175 errors
# and went green). It completes on a hosted runner, as it does on a
# workstation.
#
# Deliberately not in release.yml's way: a release is cut from a tag, and an
# advisory landing between the last green main and the tag would otherwise
# block a release whose code nobody had touched. Read this job before tagging
# instead; docs/releasing.md says so.
name: audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - .cargo/audit.toml
      - .github/workflows/audit.yml
  schedule:
    # Mondays, 06:00 UTC. The advisory database is the input that moves here,
    # not the repository.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so the cache key below means something and so a run is reproducible
  # from the commit it ran on. The advisory database is fetched fresh every
  # run regardless, so pinning the tool does not pin what it knows about.
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Just the one binary, keyed on the pinned version: a hit turns the
      # install step below into a no-op, a miss costs one `cargo install`.
      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        run: |
          set -eu
          if command -v cargo-audit >/dev/null; then
            cargo audit --version
            exit 0
          fi
          cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}"

      - name: Audit
        run: cargo audit --deny warnings
