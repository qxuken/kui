<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialog</title></head>
<body>
<div class="kit-scrim" style="height:280px;padding:16px">
  <div class="kit-surface" style="width:420px;max-width:100%">
    <div class="kit-dialog__head"><span class="kit-title">Discard the draft?</span></div>
    <div class="kit-dialog__body"><span>Three edits since the last save will be lost.</span></div>
    <div class="kit-dialog__foot">
      <button class="kit-btn">Keep editing</button>
      <button class="kit-btn kit-btn--danger">Discard</button>
    </div>
  </div>
</div>
</body>
</html>
