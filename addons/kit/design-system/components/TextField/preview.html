<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField</title></head>
<body>
<div class="kit-stage">
<div class="kit-grid">
  <div class="kit-field"><span class="kit-field__label">Name</span><div><div class="kit-input"><span class="kit-input__text">kit</span></div><div class="kit-uline"></div></div></div>
  <div class="kit-field"><span class="kit-field__label">Version</span><div><div class="kit-input is-bad"><span class="kit-input__text kit-data">1.4</span><span class="kit-err"><svg class="kit-ico " width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg><span>Three numbers: 1.4.0</span></span></div><div class="kit-uline is-bad"></div></div></div>
  <div class="kit-field"><span class="kit-field__label">Device name</span><div><div class="kit-input is-focused"><span class="kit-input__text">Maren's MacBook Pro (work)</span></div><div class="kit-uline is-focused"></div></div></div>
  <div class="kit-field"><span class="kit-field__label">Folder</span><div class="kit-row" style="flex-wrap:nowrap"><div class="kit-grow"><div class="kit-input"><span class="kit-input__text kit-input__ph">~/Tidewater</span></div><div class="kit-uline"></div></div><button class="kit-btn"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h6l2 2h10v11H3z"/></svg>Choose…</button></div></div>
</div>
</div>
</body>
</html>
