<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select</title></head>
<body>
<div class="kit-stage">
<div class="kit-grid">
  <div class="kit-field"><span class="kit-field__label">Mode</span><button class="kit-btn kit-select"><span>Automatic</span><svg class="kit-ico " width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
  <div class="kit-field"><span class="kit-field__label">Language</span><button class="kit-btn kit-select"><span class="kit-input__ph">Choose…</span><svg class="kit-ico " width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>

      <div class="kit-list-float" style="margin-top:2px">
        <div class="kit-opt is-sel">Automatic</div>
        <div class="kit-opt is-hover">Manual</div>
        <div class="kit-opt is-disabled">Off</div>
      </div>
    </div>
  </div>
</div>
</div>
