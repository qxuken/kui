<!-- @dsCard group="Look" height=150 subtitle="kit.settings" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Settings</title></head>
<body>
<div class="kit-stage">
<div class="kit-grid">
<div class="kit-col">
  <span class="kit-field__label">Comfortable</span>
  <div class="kit-row"><button class="kit-btn kit-btn--primary"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>Run</button><button class="kit-btn">Save <span class="kit-kbd">⌘S</span></button></div>
  <div style="background:var(--panel)">
    <div class="kit-tr is-sel"><span>checkout-api</span><span class="kit-grow"></span><span class="kit-data">1.18 s</span></div>
    <div class="kit-tr"><span>pricing-engine</span><span class="kit-grow"></span><span class="kit-data">410 ms</span></div>
  </div>
</div>
<div class="kit-col" style="--kit-ctl:var(--kit-ctl-compact);--kit-row:var(--kit-row-compact)">
  <span class="kit-field__label">Compact</span>
  <div class="kit-row"><button class="kit-btn kit-btn--primary"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>Run</button><button class="kit-btn">Save <span class="kit-kbd">⌘S</span></button></div>
  <div style="background:var(--panel)">
    <div class="kit-tr is-sel"><span>checkout-api</span><span class="kit-grow"></span><span class="kit-data">1.18 s</span></div>
    <div class="kit-tr"><span>pricing-engine</span><span class="kit-grow"></span><span class="kit-data">410 ms</span></div>
  </div>
</div>
</div>
</div>
</body>
</html>
