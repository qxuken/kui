<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kit</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--k-ui); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; }
  .art svg { display: block; }
  .brand { fill: var(--accent); }
  .deep { fill: var(--ink); }
  .tint { fill: var(--rule); }
  .signal { fill: var(--focus); }
  .shade { fill: var(--ink); transform: translate(var(--k-sink), var(--k-sink)); }
  .tile { rx: var(--k-radius); }
  .hair { stroke: var(--ink); stroke-width: var(--kit-hair); }
  .words { position: absolute; left: 32px; bottom: 32px; max-width: 440px; }
  .name { margin: 0; font-size: 120px; line-height: .92; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); }
  .tag { margin: var(--gap-panel) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 176×176 with its ink twin at kit-shadow-ledger (the primary button's hard shadow) · ink 176×112 bleeding off the top and right · rule 256×112 bleeding right · focus 64×48 (the one signal) — about 30% of 960×288
  arrangement a flush modular grid, pad-page (16) gutters, bottoms of the small pair on the slab's foot, like a toolbar over a table
  pattern     ledger rows, from "Separate rows with a kit-hair in rule": four kit-hair rules in ink at kit-row (22px) pitch across the rule block, a table's rows
  scales      sides in kit-row / pad-page multiples (176 = 8×22, 112, 64, 48); gutters pad-page; corners --k-radius (0 in Ledger, kit-radius-neutral in Neutral); shadow offset kit-shadow-ledger
-->
<rect class="shade tile" x="32" y="56" width="176" height="176"/>
<rect class="brand tile" x="32" y="56" width="176" height="176"/>
<rect class="deep tile" x="304" y="-8" width="184" height="112"/>
<rect class="signal tile" x="224" y="56" width="64" height="48"/>
<rect class="tint tile" x="224" y="120" width="264" height="112"/>
<line class="hair" x1="224" x2="480" y1="142.5" y2="142.5"/>
<line class="hair" x1="224" x2="480" y1="164.5" y2="164.5"/>
<line class="hair" x1="224" x2="480" y1="186.5" y2="186.5"/>
<line class="hair" x1="224" x2="480" y1="208.5" y2="208.5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Kit</h1>
<p class="tag">kui's UI kit for dense tool windows.</p>
</div>
</div>
</body>
</html>
