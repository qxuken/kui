<!-- @dsCard group="Inputs" height=170 subtitle="kit.button" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="kit-stage">
<div class="kit-row">
  <button class="kit-btn kit-btn--primary"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>Run</button>
  <button class="kit-btn">Save <span class="kit-kbd">⌘S</span></button>
  <button class="kit-btn kit-btn--ghost">Revert</button>
  <button class="kit-btn kit-btn--danger"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete</button>
  <button class="kit-btn kit-btn--success"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Copied</button>
  <button class="kit-btn is-disabled">Disabled</button>
</div>
<div class="kit-row">
  <button class="kit-btn kit-btn--primary is-hover"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>Run</button>
  <button class="kit-btn kit-btn--primary is-press"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5l12 7-12 7z" fill="currentColor"/></svg>Run</button>
  <button class="kit-btn kit-btn--on"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Theme</button>
  <button class="kit-btn is-focus">Keep editing</button>
</div>
<span class="kit-muted">At rest, under the pointer, held; a pressed toggle; keyboard focus. On Ledger the primary face lifts a pixel and sinks onto its shadow while held.</span>
</div>
</body>
</html>
