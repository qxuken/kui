<!-- @dsCard group="Layout" height=100 subtitle="kit.statusbar" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Statusbar</title></head>
<body>
<div class="kit-col" style="gap:0">
<div class="kit-statusbar">
  <div class="kit-hair"></div>
  <div class="kit-statusbar__row">
    <span class="kit-badge kit-badge--accent" style="font-family:var(--k-ui)">prod-eu</span>
    <span>12 services · 3 need attention</span>
    <span class="kit-grow"></span>
    <span>metrics: prometheus-eu-1 · scrape 1 s</span>
  </div>
</div>
<div style="height:12px"></div>
<div class="kit-statusbar">
  <div class="kit-hair"></div>
  <div class="kit-statusbar__row">
    <span class="kit-badge tone-ok" style="font-family:var(--k-ui)"><i class="kit-dot"></i>mock API</span>
    <span>Larder on 127.0.0.1:3050 · 41 requests served</span>
    <span class="kit-grow"></span>
    <span>12 in history</span>
  </div>
</div>
</div>
</body>
</html>
