<!-- @dsCard group="Layout" height=160 subtitle="kit.panel" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Panel</title></head>
<body>
<div class="kit-stage">
<div class="kit-grid">
<div class="kit-panel">
  <div class="kit-panel__head">
    <span class="kit-cap kit-cap--b">Edge latency</span>
    <span class="kit-muted kit-ellipsis">p50 · p95 · p99 in ms, by minutes ago</span>
  </div>
  <div class="kit-hair"></div>
  <div class="kit-panel__body">
    <div class="kit-insp">
      <div class="kit-insp__r"><span class="kit-insp__k" style="width:110px">Version</span><span class="kit-data">3.18.2</span></div>
      <div class="kit-insp__r"><span class="kit-insp__k" style="width:110px">Deployed</span><span>Oct 25 13:47</span></div>
      <div class="kit-insp__r"><span class="kit-insp__k" style="width:110px">Instances</span><span>4 running</span></div>
    </div>
  </div>
</div>
<div class="kit-panel">
  <div class="kit-panel__head">
    <span class="kit-cap kit-cap--b">checkout-api</span>
    <span class="kit-muted kit-ellipsis">checkout team · on call m.okafor</span>
    <span class="kit-grow"></span>
    <span class="kit-badge tone-warn"><i class="kit-dot"></i>degraded</span>
  </div>
  <div class="kit-hair"></div>
  <div class="kit-panel__body">
    <div class="kit-row">
      <button class="kit-btn kit-btn--danger"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Restart…</button>
      <button class="kit-btn"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Scale…</button>
    </div>
  </div>
</div>
</div>
</div>
</body>
</html>
