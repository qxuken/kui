<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Slider</title></head>
<body>
<div class="kit-stage">
<div class="kit-grid">
  <div class="kit-slider">
    <div class="kit-row" style="gap:0"><span class="kit-field__label">Zoom</span><span class="kit-grow"></span><span class="kit-data kit-label-size">40%</span></div>
    <div class="kit-slider__track"><div class="kit-slider__fill" style="width:40%"><span class="kit-slider__handle"></span></div><div class="kit-slider__rest"></div></div>
  </div>
  <div class="kit-slider">
    <div class="kit-row" style="gap:0"><span class="kit-field__label">Upload limit</span><span class="kit-grow"></span><span class="kit-data kit-label-size">20 MB/s</span></div>
    <div class="kit-slider__track"><div class="kit-slider__fill" style="width:66%"><span class="kit-slider__handle is-hover"></span></div><div class="kit-slider__rest"></div></div>
  </div>
</div>
</div>
</body>
</html>
