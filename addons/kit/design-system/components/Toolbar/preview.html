<!-- @dsCard group="Layout" height=120 subtitle="kit.toolbar" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toolbar</title></head>
<body>
<div class="kit-col" style="gap:0">
<div class="kit-toolbar">
  <div class="kit-toolbar__row">
    <span class="kit-title">Watchtower</span>
    <div class="kit-seg"><span class="kit-seg__o is-on kit-cap">prod-eu</span><span class="kit-seg__o kit-cap">prod-us</span><span class="kit-seg__o kit-cap">staging</span></div>
    <div class="kit-seg"><span class="kit-seg__o kit-cap">5 min</span><span class="kit-seg__o is-on kit-cap">15 min</span><span class="kit-seg__o kit-cap">1 hour</span></div>
    <span class="kit-grow"></span>
    <span class="kit-muted">live · 13:59:58</span>
    <span class="kit-check"><span class="kit-switch is-on"></span>Live</span>
  </div>
  <div class="kit-hair"></div>
</div>
<div class="kit-toolbar">
  <div class="kit-toolbar__row">
    <span class="kit-title">Field Notes</span>
    <div style="width:240px"><div class="kit-input"><svg class="kit-ico t-muted" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span class="kit-input__text kit-input__ph">Search notes</span></div><div class="kit-uline"></div></div>
    <span class="kit-grow"></span>
    <button class="kit-btn kit-btn--primary"><svg class="kit-ico " width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New note</button>
  </div>
  <div class="kit-hair"></div>
</div>
</div>
</body>
</html>
