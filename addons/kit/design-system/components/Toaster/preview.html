<!-- @dsCard group="Overlays" height=220 subtitle="kit.toaster" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toaster</title></head>
<body>
<div style="position:relative;height:220px;background:var(--bg)">
  <div class="kit-col" style="position:absolute;right:16px;bottom:16px;gap:8px;align-items:flex-end">
    <div class="kit-surface kit-toast"><div class="kit-toast__bar bar-ok"></div><div class="kit-toast__in"><span class="t-ok"><svg class="kit-ico " width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="kit-grow">Saved to disk.</span><span class="kit-x"><svg class="kit-ico " width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div></div>
    <div class="kit-surface kit-toast"><div class="kit-toast__bar bar-warn"></div><div class="kit-toast__in"><span class="t-warn"><svg class="kit-ico " width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></span><span class="kit-grow">The upstream is slow.</span><span class="kit-x"><svg class="kit-ico " width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div></div>
    <div class="kit-surface kit-toast"><div class="kit-toast__bar bar-info"></div><div class="kit-toast__in"><span class="t-focus"><svg class="kit-ico " width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg></span><span class="kit-grow">Deleted 3 rows.</span><span class="kit-toast__act"><span class="kit-cap">Undo</span></span><span class="kit-x"><svg class="kit-ico " width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></div></div>
  </div>
</div>
</body>
</html>
