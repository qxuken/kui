<!-- @dsCard group="Inputs" height=140 subtitle="kit.radio_group" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RadioGroup</title></head>
<body>
<div class="kit-stage">
<div class="kit-row" style="gap:32px;align-items:flex-start">
  <div class="kit-col" style="gap:2px">
    <span class="kit-field__label">Level</span>
    <div class="kit-check" style="min-height:var(--kit-row)"><span class="kit-radio"></span>Debug</div>
    <div class="kit-check" style="min-height:var(--kit-row)"><span class="kit-radio is-on"></span>Info</div>
    <div class="kit-check" style="min-height:var(--kit-row)"><span class="kit-radio kit-ring"></span>Warnings</div>
  </div>
  <div class="kit-col" style="gap:2px">
    <span class="kit-field__label">Appearance</span>
    <div class="kit-check" style="min-height:var(--kit-row)"><span class="kit-radio"></span>Match the system</div>
    <div class="kit-check" style="min-height:var(--kit-row)"><span class="kit-radio"></span>Light</div>
    <div class="kit-check" style="min-height:var(--kit-row)"><span class="kit-radio is-on"></span>Dark</div>
  </div>
</div>
</div>
</body>
</html>
