[package]
name = "kui-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "C API for kui (cdylib, staticlib on request, + include/kui.h)"
readme = "README.md"
publish = ["crates-io"]

[lib]
name = "kui_ffi"
# No `staticlib` here: nothing in the workspace links one, and it cost every
# build the most disk of any artifact in it. An archive is every object file
# of the dependency tree, std's included, never dead-stripped and carrying
# its symbol tables for the linker to come: 545 MB in debug (442 MB of it
# DWARF, 18 MB machine code) and 73 MB in release, where the cdylib linked
# from the same objects is 27 MB and 13.7 MB (aarch64-apple-darwin,
# 0.1.0-alpha.24). Cargo cannot set a crate type per profile, so a host
# that links statically asks for the archive when it wants one:
#
#     cargo rustc -p kui-ffi --lib --release --crate-type staticlib
#
# which leaves `target/release/libkui_ffi.a` where it always was.
crate-type = ["cdylib", "rlib"]

# The windowed runner is the only thing in this crate that needs `kui-native`, and
# `kui-native` is the whole GUI runtime: winit, wgpu, kira, accesskit, arboard. Two
# of the 135 exported functions use it (`kui_run`, `kui_run_with`) and they
# cost more than everything else together — the release cdylib is 12.3 MB
# with them and 5.1 MB without, measured on x86_64-pc-windows-msvc.
#
# So it is a feature, on by default because `kui_run` is the batteries-
# included path every C example takes. A host that drives its own loop and
# renders the display list itself — which is what the C API is *for* if you
# already have a window — turns it off and ships less than half:
#
#     cargo build -p kui-ffi --no-default-features --release
#
# One other thing is: `access`, the platform accessibility bridge a host
# attaches to a window of its own (`kui_access_attach`, backlog F269). It is
# AccessKit's adapter for the platform (accesskit_macos, accesskit_windows,
# accesskit_unix over D-Bus), which the core library otherwise has none of,
# so a host that does not want it can leave it out; on by default, because
# an accessibility feature that is off by default goes untested and
# unshipped. Without it `kui_access_attach` answers false. The runner-less
# library a release ships keeps it:
#
#     cargo build -p kui-ffi --no-default-features --features access --release
#
# Nothing else is behind a flag. The builder, layout, text, access, input
# and draw-data surface is what a plugin calls and what a host embeds, and
# splitting *that* saves nothing: a plugin links against none of it (it
# imports, and panel.dll is 147 KB), so there is no ext-only build to make.
[features]
default = ["runner", "access"]
runner = ["dep:kui-native"]
access = ["dep:kui-access", "kui-access/platform"]

[dependencies]
# The renderer's instances as bytes (`kui_pack_instances`, backlog F234).
bytemuck.workspace = true
kui-core.workspace = true
kui-native = { workspace = true, optional = true }
# The host's accessibility bridge (feature `access`, backlog F269).
kui-access = { workspace = true, optional = true }
# Every host loads a `.lua` extension through `open_extension` (ADR 0059):
# the Lua VM ships in this library, and a script opens C plugins through
# the loader this crate registers with kui-lua.
kui-lua.workspace = true

# The examples' devtools (docs/adr/0021), for the Rust host below.
[dev-dependencies]
kui-devtools.workspace = true

[package.metadata.kui]
headless = ["c_panel"]

# See the note in crates/kui-native/Cargo.toml: examples live under examples/ at the
# root, so cargo needs the path. This host and the plugin it dlopens are the
# two halves of one example, so both are in examples/c/features/slots and
# differ only by extension; the cbuild tool builds the plugin. The target keeps the `c_`
# prefix the file dropped: every example binary in the workspace lands in one
# flat target/debug/examples, so a `panel` here would collide with kui-lua's.
[[example]]
name = "c_panel"
path = "../../examples/c/features/slots/panel.rs"
# The Rust host is a `kui-native` app, so it needs what `kui-native` needs.
required-features = ["runner"]
