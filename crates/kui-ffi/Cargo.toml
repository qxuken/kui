[package]
name = "kui-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C API for kui (cdylib/staticlib + include/kui.h)"
publish = ["forgejo"]

[lib]
name = "kui_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kui-core.workspace = true
kui.workspace = true

# See the note in crates/kui/Cargo.toml: examples live under examples/ at the
# root, so cargo needs the path. This host and the plugin it dlopens are the
# two halves of one example, so both are in examples/c and differ only by
# extension; build.sh there builds the plugin. The target keeps the `c_`
# prefix the file dropped: every example binary in the workspace lands in one
# flat target/debug/examples, so a `panel` here would collide with kui-lua's.
[[example]]
name = "c_panel"
path = "../../examples/c/panel.rs"
