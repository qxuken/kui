[package]
name = "kui-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Lua extensions for kui via mlua: table trees in, events as tables out"
publish = ["crates-io"]
# Teal's compiler, vendored for the tests that check `teal_decls()` with
# it (src/teal.rs); 650 KB no user of the crate needs.
exclude = ["tests/tl"]

[dependencies]
kui-core.workspace = true
mlua.workspace = true
# No kui-ffi: kui-ffi depends on this crate so that every host loads `.lua`
# extensions (ADR 0059), and a script's `env.add_extension` opens a C plugin
# through the loader kui-ffi registers (`set_native_loader`).

[dev-dependencies]
# The C loader, for the examples and tests whose script loads a C plugin
# (`kui_ffi::register_native_loader`). A dev-dependency may close the cycle.
kui-ffi.workspace = true
divan.workspace = true
kui-native.workspace = true
# The examples' devtools (docs/adr/0021), for the Rust host of the panel.
kui-devtools.workspace = true
# Kit (addons/kit) placed through its generated wrappers, and its schema
# read back, for tests/kit.rs.
kui-kit.workspace = true
kui-addon-schema.workspace = true
# tests/conformance.rs drives the scene corpus, which kui-core keeps behind a
# feature; on here only, so the published extension does not carry it.
kui-core = { workspace = true, features = ["conformance"] }
# Reads `kui-core/tests/fixtures/size_spellings.json`, the size spellings
# every binding is run through (backlog RG94).
serde_json = "1"

# See the note in crates/kui-native/Cargo.toml: examples live under examples/ at the
# root, so cargo needs the path. A Lua extension has no window of its own, so
# both of these are Rust hosts and both live in examples/lua beside the script
# they run (the panel under features/slots, the bench under tools). lua_panel keeps the `lua_` prefix the file dropped: every example
# binary in the workspace lands in one flat target/debug/examples, so a
# `panel` here would collide with kui-ffi's.
[package.metadata.kui]
headless = ["lua_panel", "lua_kit_spike"]

[[example]]
name = "bench"
path = "../../examples/lua/tools/bench.rs"

# Writes packages/lua's type files (`nu scripts/gen.nu` runs it).
[[example]]
name = "lua-types"
path = "../../examples/lua/tools/types.rs"

[[example]]
name = "lua_panel"
path = "../../examples/lua/features/slots/panel.rs"

# Kit's M0 spike (addons/kit): its Teal components in a Rust host.
[[example]]
name = "lua_kit_spike"
path = "../../examples/lua/features/kit/spike.rs"

[[bench]]
name = "kit"
harness = false

[[bench]]
name = "sizes"
harness = false

[[bench]]
name = "walk"
harness = false

# The book's step 11 (docs/book, docs/adr/0039): a Rust host and two Lua
# plugins, so it lives with the crate that loads them; its `mod tests`
# drives it headless.
[[example]]
name = "tutorial_11_extensions"
path = "../../examples/rust/tutorial/11_extensions.rs"
test = true
