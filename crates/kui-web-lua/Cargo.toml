[package]
name = "kui-web-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "wasi")'.dependencies]
kui-core = { workspace = true, features = ["svg", "devtools"] }
kui-kit.workspace = true
kui-lua.workspace = true
kui-web = { workspace = true, features = ["packed-gpu"] }
mlua = { workspace = true, features = ["serde"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("rust-wgpu"))'] }

[dev-dependencies]
mlua.workspace = true
