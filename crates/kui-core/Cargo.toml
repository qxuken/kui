[package]
name = "kui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "kui contract: flat per-frame tree, clay-style flex layout, text stack, events as data, quad display list"
readme = "README.md"
publish = ["crates-io", "drydock9"]

[dependencies]
slotmap.workspace = true
rustc-hash.workspace = true
cosmic-text.workspace = true
swash.workspace = true
naga.workspace = true
# Word boundaries for the access tree's text runs (already in the tree via cosmic-text).
unicode-segmentation = "1"
# Break opportunities for a wrapped long line's rows (already in the tree via cosmic-text).
unicode-linebreak = "0.1"
# The script a fallback list is asked for (`text::AppFallback`; already in the tree via cosmic-text).
unicode-script = "0.5"
# The handler rows on `EventSpec`, two inline (already in the tree via cosmic-text).
smallvec = { version = "1", features = ["const_new"] }
kui-derive = { workspace = true, optional = true }
# The recording's format (ADR 0058): no dependencies of its own.
kui-trace.workspace = true
# The `svg` element (ADR 0063): usvg parses and flattens a document into
# paths, resvg rasterizes the ones kui's `path` cannot draw. 0.46 shares
# tiny-skia 0.11 with the tree; no text (no second font stack), no svgz, no
# embedded raster decoders.
usvg = { version = "0.46", default-features = false, optional = true }
resvg = { version = "0.46", default-features = false, optional = true }
# `tracing` spans for every recorded span, under the `tracing` feature
# (ADR 0058, decision 12); already in the tree through winit and zbus.
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# The thread's CPU clock, beside a span's wall time (ADR 0058, decision 6).
libc = "0.2"

[features]
default = ["devtools", "svg"]
# The devtools panel the core draws into any app's frame when asked
# (`Core::set_devtools`, `KUI_DEVTOOLS=1`; docs/adr/0024). On by default so
# every binding's build has it; off for a kiosk build, where the doors
# stay and do nothing.
devtools = []
# The `svg` element's parser and rasterizer (ADR 0063): usvg and resvg,
# about 1.1 MB of a release library. Off, the element and its doors stay
# and every document is refused with `svg-malformed`.
svg = ["dep:usvg", "dep:resvg"]
# `#[derive(Message)]`, a typed Rust message to and from the payload (backlog
# C50). Off here, since only a Rust app uses it; `kui-native` turns it on.
derive = ["dep:kui-derive"]
# The scene corpus (src/conformance.rs): fourteen scene builders, the
# coverage derivation, the report formatter and the fixture bytes. It is test
# infrastructure - every binding's adapter rebuilds the scenes and diffs its
# report against the Rust one - and off by default so no shipped binary
# carries it. The dev-dependency below turns it on for this crate's own
# tests, benches and examples, so `cargo test` cannot leave the corpus out;
# `required-features` on the dump example is for the message when it is run
# from a context that has the feature off.
conformance = []
# Every span the recording keeps also entered as a `tracing` span (target
# `kui`) while a subscriber listens — the door to Tracy, Instruments
# (`tracing-oslog`) and Perfetto live (ADR 0058, decision 12). Off by
# default.
tracing = ["dep:tracing"]

[dev-dependencies]
divan.workspace = true
# Self-dependency: the one way to enable a feature for the tests without
# gating the test target itself (which `cargo test` would then silently skip).
kui-core = { path = ".", features = ["conformance"] }
# Reads `kui-core/tests/fixtures/size_spellings.json`, the size spellings
# every binding is run through (backlog RG94).
serde_json = "1"

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "highlight"
harness = false

[[bench]]
name = "stream"
harness = false

[[bench]]
name = "long_line"
harness = false

[[bench]]
name = "sizes"
harness = false

[[bench]]
name = "cells"
harness = false

[[bench]]
name = "levels"
harness = false

[[bench]]
name = "paths"
harness = false

[[bench]]
name = "channel"
harness = false

# See the note in crates/kui-native/Cargo.toml: examples live under examples/ at the
# root, so cargo needs the path.
[[example]]
name = "conformance-dump"
path = "../../examples/rust/tools/conformance-dump.rs"
required-features = ["conformance"]

[[example]]
name = "schema-dump"
path = "../../examples/rust/tools/schema-dump.rs"
