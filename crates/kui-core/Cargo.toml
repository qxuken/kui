[package]
name = "kui-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "kui contract: flat per-frame tree, clay-style flex layout, text stack, events as data, quad display list"
readme = "README.md"
publish = ["crates-io", "drydock9"]

[dependencies]
slotmap.workspace = true
rustc-hash.workspace = true
cosmic-text.workspace = true
swash.workspace = true
naga.workspace = true
# Word boundaries for the access tree's text runs (already in the tree via cosmic-text).
unicode-segmentation = "1"
# Break opportunities for a wrapped long line's rows (already in the tree via cosmic-text).
unicode-linebreak = "0.1"
# The script a fallback list is asked for (`text::AppFallback`; already in the tree via cosmic-text).
unicode-script = "0.5"
kui-derive = { workspace = true, optional = true }

[features]
default = ["devtools"]
# The devtools panel the core draws into any app's frame when asked
# (`Core::set_devtools`, `KUI_DEVTOOLS=1`; docs/adr/0024). On by default so
# every binding's build has it; off for a kiosk build, where the doors
# stay and do nothing.
devtools = []
# `#[derive(Message)]`, a typed Rust message to and from the payload (backlog
# C50). Off here, since only a Rust app uses it; `kui-native` turns it on.
derive = ["dep:kui-derive"]
# The scene corpus (src/conformance.rs): fourteen scene builders, the
# coverage derivation, the report formatter and the fixture bytes. It is test
# infrastructure - every binding's adapter rebuilds the scenes and diffs its
# report against the Rust one - and off by default so no shipped binary
# carries it. The dev-dependency below turns it on for this crate's own
# tests, benches and examples, so `cargo test` cannot leave the corpus out;
# `required-features` on the dump example is for the message when it is run
# from a context that has the feature off.
conformance = []

[dev-dependencies]
divan.workspace = true
# Self-dependency: the one way to enable a feature for the tests without
# gating the test target itself (which `cargo test` would then silently skip).
kui-core = { path = ".", features = ["conformance"] }
# Reads `kui-core/tests/fixtures/size_spellings.json`, the size spellings
# every binding is run through (backlog RG94).
serde_json = "1"

[[bench]]
name = "frame"
harness = false

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "highlight"
harness = false

[[bench]]
name = "stream"
harness = false

[[bench]]
name = "long_line"
harness = false

[[bench]]
name = "sizes"
harness = false

[[bench]]
name = "cells"
harness = false

[[bench]]
name = "levels"
harness = false

# See the note in crates/kui-native/Cargo.toml: examples live under examples/ at the
# root, so cargo needs the path.
[[example]]
name = "conformance-dump"
path = "../../examples/rust/tools/conformance-dump.rs"
required-features = ["conformance"]

[[example]]
name = "schema-dump"
path = "../../examples/rust/tools/schema-dump.rs"
