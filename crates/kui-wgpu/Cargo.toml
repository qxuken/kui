[package]
name = "kui-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "wgpu backend for kui: one instanced pipeline, a single draw call per frame"
publish = ["crates-io", "drydock9"]

[dependencies]
kui-core.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true

# `Gpu::remove_device`: D3D12's own way to lose a device on purpose.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D12",
    # `report_faults`: which module a crash is in, written to stderr
    # without allocating.
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]

# Not a divan bench: it drives a GPU and prints a table. See its module doc
# and `docs/adr/0015-a-fragment-element-and-the-painter-it-is-not.md`.
[[bench]]
name = "split"
harness = false
