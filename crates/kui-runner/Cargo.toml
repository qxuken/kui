[package]
name = "kui-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
archive = ["dep:crc32fast", "dep:flate2", "dep:ring"]
embedded = ["archive", "dep:kui-native", "dep:tempfile"]

[dependencies]
kui-core.workspace = true
kui-kit.workspace = true
kui-lua.workspace = true
kui-native = { workspace = true, optional = true, features = ["mobile"] }
mlua = { workspace = true, features = ["serde"] }
serde_json = "1"
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.1", optional = true }
ring = { version = "0.17", optional = true }
tempfile = { version = "3", optional = true }
