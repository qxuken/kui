[package]
name = "kui-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kui-core = { path = "../kui-core", version = "0.1.0-alpha.81", default-features = false, features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
rust-wgpu = ["dep:js-sys", "dep:kui-wgpu", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
svg = ["kui-core/svg"]
devtools = ["kui-core/devtools"]
packed-gpu = ["dep:postcard", "dep:serde"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.106", optional = true }
kui-wgpu = { workspace = true, optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
web-sys = { version = "0.3.106", features = ["HtmlCanvasElement"], optional = true }

[[example]]
name = "counter"
path = "../../examples/web/counter.rs"
crate-type = ["cdylib"]

[[example]]
name = "notes"
path = "../../examples/web/notes.rs"
crate-type = ["cdylib"]

[[example]]
name = "packed_renderer"
path = "../../examples/web/packed_renderer.rs"
crate-type = ["cdylib"]
required-features = ["packed-gpu", "rust-wgpu"]
