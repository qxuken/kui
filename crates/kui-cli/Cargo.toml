[package]
name = "kui-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The kui runner: run a Lua or Teal app with Kit and a standard library (ADR 0064)"
publish = false

[[bin]]
name = "kui"
path = "src/main.rs"

[dependencies]
kui-core.workspace = true
kui-native.workspace = true
kui-lua.workspace = true
kui-trace = { workspace = true, features = ["lua"] }
mlua.workspace = true
toml = "0.9"
yaml-rust2 = "0.10"
ureq = "3"
tiny_http = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
ring = "0.17"
base64 = "0.22"
argon2 = "0.5"
# `kui.secrets`: the OS's store, one crate per platform under keyring-core.
keyring-core = "1"
flate2 = "1.1"
crc32fast = "1.5"
png = "0.18"
mimalloc = { version = "=0.1.48", optional = true }
# The C mimalloc (2.2.4) the crate above builds, pinned too: main.rs sets an
# option by its number in this version's mimalloc.h.
libmimalloc-sys = { version = "=0.1.44", optional = true, default-features = false }

[features]
default = ["mimalloc"]
# mimalloc as the runner's global allocator, the Lua heaps' too: mlua
# allocates through Rust's. Purging at once, it holds the Kit gallery's
# footprint 17–36% under the system allocator's (backlog C150).
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[build-dependencies]
# Gzips the docs the runner carries (build.rs, ADR 0071).
flate2 = "1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

# The Secret Service over zbus, already in the tree through rfd's portal:
# no libdbus to link, so a Linux runner still builds anywhere.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
