[workspace]
resolver = "3"
members = [
    "crates/kui-core",
    "crates/kui-wgpu",
    "crates/kui",
    "crates/kui-lua",
    "crates/kui-ffi",
    "crates/kui-node",
    # The examples' devtools (docs/adr/0021): a dev-dependency of the crates
    # whose examples run inside it, never published.
    "examples/devtools",
]

[workspace.package]
version = "0.1.0-alpha.10"
edition = "2024"
license = "MIT"
repository = "https://drydock9.qxuken.dev/qxuken/kui"

[workspace.dependencies]
kui-core = { path = "crates/kui-core", version = "0.1.0-alpha.10", registry = "forgejo" }
kui-wgpu = { path = "crates/kui-wgpu", version = "0.1.0-alpha.10", registry = "forgejo" }
kui = { path = "crates/kui", version = "0.1.0-alpha.10", registry = "forgejo" }
# `default-features = false` here so a member asks for the windowed C entry
# points explicitly; the cdylib build gets them from kui-ffi's own manifest.
kui-ffi = { path = "crates/kui-ffi", version = "0.1.0-alpha.10", registry = "forgejo", default-features = false }
kui-devtools = { path = "examples/devtools" }

slotmap = "1.1.1"
rustc-hash = "2"
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
# Same major cosmic-text builds on: `Font::as_swash()` hands us its FontRef.
swash = "0.2"
wgpu = "30"
# WGSL validation for `fragment` sources at registration (ADR 0015); the
# same naga wgpu pins, so a windowed app links one copy.
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
mlua = { version = "0.12", features = ["lua55", "vendored"] }
divan = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.bench]
debug = true
