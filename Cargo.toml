[workspace]
resolver = "3"
members = [
    "crates/kui-value",
    "crates/kui-channel",
    "crates/kui-core",
    "crates/kui-derive",
    "crates/kui-trace",
    "crates/kui-wgpu",
    "crates/kui-native",
    # The platform accessibility bridge, shared by the runner and a host's
    # own window (backlog F269).
    "crates/kui-access",
    "crates/kui-lua",
    "crates/kui-ffi",
    "crates/kui-node",
    # Typed wrappers for an add-on's components, from its schema (ADR 0066).
    "crates/kui-addon-schema",
    # The `kui` runner (ADR 0064).
    "crates/kui-cli",
    # Kit's typed wrappers, generated from addons/kit/schema.lua.
    "addons/kit/bindings/rust",
    # The examples' devtools (docs/adr/0021): a dev-dependency of the crates
    # whose examples run inside it, never published.
    "examples/devtools",
    # The fuzz targets (cargo-fuzz) and the stable replay of what they
    # found; see fuzz/Cargo.toml and scripts/fuzz.nu. Never published.
    "fuzz",
]

[workspace.package]
version = "0.1.0-alpha.72"
edition = "2024"
license = "MIT"
# `homepage` is the book (docs/book), which is what a reader arriving from
# crates.io wants first; `repository` is GitHub, where the repository lives.
repository = "https://github.com/qxuken/kui"
homepage = "https://kui-book.qxuken.dev"
keywords = ["gui", "ui", "layout", "wgpu"]
categories = ["gui"]

[workspace.dependencies]
# No `registry` key: the kui crates resolve from crates.io, which is where
# they publish (scripts/publish-crates.nu), and crates.io refuses a
# dependency from any other registry.
kui-value = { path = "crates/kui-value", version = "0.1.0-alpha.72" }
kui-channel = { path = "crates/kui-channel", version = "0.1.0-alpha.72" }
kui-core = { path = "crates/kui-core", version = "0.1.0-alpha.72" }
kui-derive = { path = "crates/kui-derive", version = "0.1.0-alpha.72" }
kui-trace = { path = "crates/kui-trace", version = "0.1.0-alpha.72" }
kui-wgpu = { path = "crates/kui-wgpu", version = "0.1.0-alpha.72" }
kui-native = { path = "crates/kui-native", version = "0.1.0-alpha.72" }
# `default-features = false` so the runner takes the translation alone and
# nothing it brings its own of (`accesskit_winit`); kui-ffi asks for the
# host's bridge with the `platform` feature.
kui-access = { path = "crates/kui-access", version = "0.1.0-alpha.72", default-features = false }
# `default-features = false` here so a member asks for the windowed C entry
# points explicitly; the cdylib build gets them from kui-ffi's own manifest.
kui-ffi = { path = "crates/kui-ffi", version = "0.1.0-alpha.72", default-features = false }
kui-lua = { path = "crates/kui-lua", version = "0.1.0-alpha.72" }
kui-devtools = { path = "examples/devtools" }
# Kit's generated Rust wrappers and the generator itself (ADR 0066); never
# published yet.
kui-kit = { path = "addons/kit/bindings/rust" }
kui-addon-schema = { path = "crates/kui-addon-schema" }

slotmap = "1.1.1"
rustc-hash = "2"
cosmic-text = { version = "0.19", features = ["shape-run-cache"] }
# Same major cosmic-text builds on: `Font::as_swash()` hands us its FontRef.
swash = "0.2"
wgpu = "30"
# WGSL validation for `fragment` sources at registration (ADR 0015); the
# same naga wgpu pins, so a windowed app links one copy.
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
mlua = { version = "0.12", features = ["lua55", "vendored"] }
divan = "0.1"

# File and line in backtraces, no variables: full debug info was 70–85% of
# target/'s bytes, and on macOS each incremental rebuild leaves its objects
# behind for the debugger. `CARGO_PROFILE_DEV_DEBUG=full` brings it back
# for a debugging session (a separate set of builds).
[profile.dev]
debug = "line-tables-only"

# Dependencies optimised and without debug info: they are not stepped into
# at opt-level 2, and without it rustc keeps no loose objects for them.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.bench]
debug = true
