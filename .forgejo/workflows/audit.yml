# RustSec advisories against Cargo.lock, kept out of ci.yml on purpose.
#
# `cargo audit` reads the lockfile and nothing else: no target dir, no fonts,
# no Node, no conformance report. Folding it into ci.yml's `check` would hang
# a job that finishes in under a minute off one that builds the whole
# workspace, and it would gain nothing from the cargo cache that keeps `check`
# a single job. It is also the one check here whose result can change without
# anyone pushing a commit - an advisory is published against code that has not
# moved - which is why this workflow has a schedule and ci.yml does not. A
# weekly run on main is the part that actually earns its keep; the push and
# pull_request triggers just catch a lockfile change at the moment it is made.
#
# It runs with `--deny warnings`, so an unmaintained crate fails the job the
# same as a vulnerability does. The escape hatch is .cargo/audit.toml: an
# ignore entry there, with a comment saying what pulls the crate in and what
# would let us delete the line. Without that file today's tree is red
# (ttf-parser, RUSTSEC-2026-0192), which is the intended shape - the ignore
# list is the record of what we have decided to live with.
#
# Blocking on push and pull request, and deliberately absent from `publish`'s
# `needs` in ci.yml: a release is cut from a tag, and an advisory landing
# between the last green main and the tag would otherwise block a release
# whose code nobody had touched. Read this job before tagging instead; the
# README's release checklist says so.
#
# The container is the stock node image for the same reason ci.yml's jobs are:
# actions/checkout and actions/cache are JavaScript actions and the runner
# execs `node` inside the job container to run them. Rust comes from rustup.
name: audit

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - .cargo/audit.toml
      - .forgejo/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - .cargo/audit.toml
      - .forgejo/workflows/audit.yml
  schedule:
    # Mondays, 06:00 UTC. The advisory database is the input that moves here,
    # not the repository.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  # Pinned so the cache key below means something and so a run is reproducible
  # from the tag it ran on. The advisory database is fetched fresh every run
  # regardless, so pinning the tool does not pin what it knows about.
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  audit:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install rust
        run: |
          set -eu
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain stable
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          "${CARGO_HOME}/bin/cargo" --version

      # Just the one binary, keyed on the pinned version: a hit turns the
      # install step below into a no-op, a miss costs one `cargo install`.
      # Restored after rustup so it cannot be clobbered by the toolchain's
      # own shims in the same directory.
      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: /usr/local/cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        run: |
          set -eu
          if command -v cargo-audit >/dev/null; then
            cargo audit --version
            exit 0
          fi
          cargo install --locked "cargo-audit@${CARGO_AUDIT_VERSION}"

      # --deny warnings: unmaintained and yanked crates fail too, and
      # .cargo/audit.toml is the only way to accept one.
      - name: Audit
        run: cargo audit --deny warnings
