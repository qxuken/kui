# Forgejo Actions. `check` runs once per commit on every push and pull
# request; pushing a `v*` tag additionally runs the release pipeline after it:
#
#   gate ── check ──┬── build-linux   (x64, arm64, via zig)  ──┐
#                   ├── build-windows (x64, via cargo-xwin)  ──┼── publish
#                   └── build-macos   (arm64, x64, via zig)  ──┘
#
# A release tag is cut at a commit that is already on main, so the same
# commit arrives twice: once as a push to main and once as the push of the
# tag. Both would run `check`, and on a single runner the second one is a
# queue nobody is waiting for. The `concurrency` block below puts both runs
# in one group keyed by the commit, and lets only the tag run cancel -
# whichever order the two push events are handled in, the tag run is the one
# that survives, because it is the only one that can also publish. When the
# tag event is handled first the main run is not cancelled but blocked
# behind it, and running `check` over a commit the tag run has just checked
# would be the same waste, so the `gate` job stands that run down instead.
# Between them the two cover both orders, and a tagged commit is checked
# exactly once.
#
# Keying the group by commit rather than by branch is what makes the tag
# run's cancel safe: it can only ever cancel a run that is about its own
# commit. The price is that declaring a group replaces Forgejo's default
# for a branch, which cancels a run when a newer commit is pushed to the
# same branch - two quick pushes to main now both run to the end. Pull
# requests keep that behaviour, since their group is the pull request.
#
# Native runs on real hardware are not here either. `smoke-macos` and
# `smoke-windows` live in .forgejo/workflows/smoke.yml, because they need
# none of what makes `check` expensive and are on no release path - and
# because a job whose runner label matches nothing sits in the queue rather
# than failing fast, which would leave a `ci` run without a result long
# after `check` and `publish` had finished. See the note at the top of that
# file for what they do and do not buy.
#
# RustSec advisories are not checked here. They live in their own workflow,
# .forgejo/workflows/audit.yml, because `cargo audit` reads Cargo.lock and
# needs none of what makes this job expensive - and because its result can go
# red without a commit, so it runs on a weekly schedule as well as on pushes
# that touch the lockfile. It is not in `publish`'s `needs` either; see the
# note at the top of that file.
#
# check is one job so the cargo target dir is built once and shared by fmt,
# clippy, the workspace tests, the two C examples (C as the host, and C as an
# extension inside a Rust host), the Node addon parity tests and the Node
# example typecheck (which is what exercises the shipped .d.ts).
# It is also what makes the scene corpus work: all four adapters over
# crates/kui-core/src/conformance.rs run here, on one machine with one set
# of fonts, against one generated reference report - which is why the
# report is never checked in and the C and Node steps depend on the
# `Conformance reference report` step above them. Separate jobs would each
# rebuild the target dir (or each restore a multi-GB cache), and it is far
# too big to hand between jobs as an artifact. What IS handed
# between jobs is small: each build leg uploads one kui-node cdylib as an
# artifact, and publish downloads them all into packages/kui/prebuilds before
# `npm publish`, so the tarball ships a native addon per platform. The
# artifact actions are the v3 ones: Forgejo's artifact backend speaks that
# API, and v4 fails with "not currently supported on GHES". The library
# crates go to the Forgejo cargo registry (`drydock9` in .cargo/config.toml) in
# dependency order first.
#
# The docker jobs use the stock node image rather than the rust one:
# actions/checkout, cache and the artifact actions are JavaScript actions and
# the runner execs `node` inside the job container to run them, so the image
# has to ship Node. Rust comes from rustup; the only other system additions are
# a font (the text tests measure real glyphs), zstd (actions/cache falls back
# to single-core gzip without it - see `Install system deps` in `check`) and,
# for a cross leg, a linker.
#
# Release prerequisites:
#   * a repository secret PACKAGES_TOKEN: a personal access token with
#     write:packages (the automatic FORGEJO_TOKEN cannot publish packages);
#   * one runner labelled `docker`. Every target is cross-compiled on it
#     (rustc targets anything; only the linkers and platform SDKs differ):
#     - Linux: cargo-zigbuild for both arches - zig ships glibc for every
#       arch and lets the target name pin the floor (`.2.28`), so the
#       addon runs on distros older than the runner's own bookworm;
#     - Windows: the MSVC target with cargo-xwin (clang-cl + lld-link from
#       Debian's LLVM, the Windows SDK/CRT fetched by xwin into a cached
#       dir). napi-sys resolves N-API symbols at load time through
#       libloading, so nothing links against node.exe; the mingw target is
#       not an option because napi-build wants a libnode.dll there;
#     - macOS: cargo-zigbuild (zig's Mach-O linker) against a copy of
#       Xcode's MacOSX.sdk for the framework stubs (Metal, AppKit, ...),
#       downloaded once into a cached dir. Apple's Xcode license governs
#       that SDK - read it before relying on this leg. napi-build links
#       Apple addons with -undefined dynamic_lookup, so nothing from node
#       is needed. Verified 2026-09-02: the Linux-built arm64 dylib loads
#       on a Mac and passes the parity tests - which exercises the addon's
#       N-API surface, and nothing beyond it.
#
# Compile-checked only, and worth saying plainly: every target above is
# built on Linux and never run on the platform it targets, so the code
# written for those platforms is compiled and linked but never executed.
# Nothing in this workflow dispatches a Windows message or answers an
# NSAccessibility query. That leaves uncovered:
#
#   * crates/kui-native/src/windows_nc.rs - the WM_NCHITTEST / DWM caption work
#     behind custom chrome (drag strip, caption buttons, resize borders);
#   * the macOS traffic-light inset in `widgets::titlebar_with`, and the
#     `native_controls` rect that feeds it;
#   * crates/kui-native/src/access_bridge.rs - the whole AccessKit bridge (UIA,
#     NSAccessibility, AT-SPI).
#
# Neither windows_nc.rs nor access_bridge.rs contains a single #[test]:
# the headless suite pins the data they carry, not the platform's
# acceptance of it. The optional smoke jobs in smoke.yml narrow the gap -
# they compile with the platform's own toolchain, link against the real SDK
# and run the workspace tests there - but they do not close it, because
# there are no tests to run against those two files. Behavioural coverage
# of the macOS access tree is scripts/ax-audit.swift, a manual pre-release
# step (see README, "To cut a release"); on Windows there is none.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One group per commit, so the push to main and the push of the tag that
# names it do not both run `check`; see the note above. Only a tag run
# cancels what is already in its group - a push to main waits for a tag run
# at the same commit instead of killing the release, and `gate` then stands
# it down. Pull requests group by the pull request and cancel, which is what
# Forgejo does for them anyway. The prefix keeps this group distinct from
# smoke.yml's: groups are per repository, not per workflow. Forgejo has read
# this block since v14.0 (January 2026); on anything older only `gate`
# speaks, and the two runs go back to queueing behind each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Linking the winit+wgpu examples with full debug info needs more memory
  # than a small runner has (ld gets OOM-killed); line tables keep panic
  # locations readable at a fraction of the size, and two jobs keep two
  # linkers from running at once.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "2"
  CARGO_HOME: /usr/local/cargo
  RUSTUP_HOME: /usr/local/rustup
  # The Nushell the scripts are written against (scripts/*.nu), pinned like
  # every other tool here.
  NU_VERSION: "0.116.0"

jobs:
  # Answers one question - does this commit still need checking? - and is
  # the only job `check` waits for. A push to main whose commit already
  # carries a `v*` tag is stood down here: that tag's own run does the
  # checking, and this run only exists because the tag was pushed after the
  # branch (or was handled first and blocked this one on the concurrency
  # group above). Everything else - a pull request, a push to main with no
  # tag on it, the tag run itself - runs.
  #
  # It costs a container start on every run - three seconds, measured
  # 2026-09-07 - which is the price of not having `check` decide for itself:
  # the decision has to be made before the expensive steps, and a step-level
  # guard would have to be repeated on every step below it. No checkout: one `ls-remote` answers it, and the
  # question is about the remote's tags rather than the workspace's. If the
  # lookup cannot be made at all the answer is yes, check - a run that
  # checks twice is better than a commit that is never checked.
  gate:
    runs-on: docker
    container:
      image: node:24-bookworm
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Does this commit still need checking
        id: decide
        env:
          # Read access to this repository is all the lookup needs, and the
          # instance does not answer anonymously. Passed through git's
          # config env vars rather than in the URL so the token stays out of
          # the process arguments.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.extraheader
          GIT_CONFIG_VALUE_0: "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -eu
          tagged=
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              if tags=$(git ls-remote --tags \
                    "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" 'refs/tags/v*'); then
                # A lightweight tag lists the commit directly; an annotated
                # one lists the tag object and a peeled `^{}` line with the
                # commit. Matching column one covers both. An `if`, not a
                # `&&`: under `set -e` a grep that matches nothing would end
                # the job, and a failed gate skips `check`.
                if printf '%s\n' "$tags" | grep -q "^${GITHUB_SHA}[[:space:]]"; then
                  tagged=yes
                fi
              else
                echo "could not list tags; checking this commit anyway"
              fi
              ;;
          esac
          if [ -n "$tagged" ]; then
            echo "${GITHUB_SHA} carries a v* tag - that tag's own run checks it"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4

      # The repository's scripts are Nushell, so one script runs on every
      # platform a workstation or runner has; the image has curl, and the
      # release tarball's nu, built for the runner's arch against glibc,
      # runs on bookworm as it is.
      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      # The book's Examples part lists every example; an example added,
      # renamed or removed without a rerun of the script would leave the
      # published book without it (or failing to build). Needs nothing but
      # the checkout, so it runs first and fails in seconds.
      - name: Book examples are listed
        run: nu scripts/book-examples.nu --check

      - name: Install system deps
        run: |
          set -eu
          apt-get update
          # ALSA headers: the runner crate's audio backend (kira/cpal) links
          # libasound on Linux.
          #
          # zstd is for actions/cache, which probes for it and silently
          # falls back to gzip when it is missing - which is what
          # node:24-bookworm ships. gzip gets one core and no more; zstdmt
          # gets every core and writes a slightly smaller file. Run 249
          # (2026-09-08) spent 24m33s gzipping this job's target dir, which
          # is what this line is here to stop. The compression method is
          # part of a cache entry's identity, so the first run after this
          # lands misses every existing entry and builds cold - and that
          # miss is also what resets the dir the prune step below then
          # keeps bounded.
          apt-get install -y --no-install-recommends fonts-dejavu-core ca-certificates curl \
            pkg-config libasound2-dev zstd
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain stable -c rustfmt -c clippy
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          "${CARGO_HOME}/bin/cargo" --version
          node --version
          npm --version

      # Restore and save are separate steps here, unlike the build legs
      # below, because this job's cache is the one that got out of hand and
      # only one half of it is expensive. Run 249 (2026-09-08): restore
      # 8m26s, the checks themselves 4m58s, save 26m30s - 41 minutes to
      # check a commit, 33 of them moving a 9 GB tarball around. The build
      # legs cache the same paths and pay 12s and 76s for 712 MB, which is
      # what a cache this size is supposed to cost; the difference is not
      # the runner, it is the 9 GB.
      #
      # A pull request gets nothing back for the save half: it restores
      # what the last push to main left, and its next push restores exactly
      # that again. So a pull request reads the cache and stops there, and
      # a push - main, or the tag that names the same commit - is what
      # writes one back.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: cargo-${{ runner.os }}-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-v2-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Covers the Rust and Lua adapters over the scene corpus
      # (crates/kui-core/src/conformance.rs): kui-core asserts the scenes
      # against their checked-in expectations and that they still cover
      # every schema::CUSTOM and schema::ELEMENTS row; kui-lua rebuilds
      # them from Lua tables and diffs report against report. The corpus
      # is behind kui-core's `conformance` feature (off in every shipped
      # build); no flag is passed here on purpose, because kui-core and
      # kui-lua both turn it on through a dev-dependency, so a plain
      # `cargo test` cannot leave the corpus out - which is what keeps it
      # from becoming skippable the way A6 found the Node half was.
      - name: Test
        run: cargo test --workspace

      # The book (docs/book, ADR 0039) includes its code from the tutorial
      # steps by anchor, so a step whose anchor moved or went missing is a
      # build failure here rather than a chapter that quietly shows nothing.
      # The steps themselves compile under `cargo test` above.
      - name: Book
        run: |
          cargo install mdbook --locked
          mdbook build docs/book

      # The conformance reference: quad digests over real glyph geometry,
      # so it holds only for this machine's fonts and is never checked in.
      # The C and Node adapters below diff their own scenes against it.
      - name: Conformance reference report
        run: |
          cargo run -p kui-core --features conformance --example conformance-dump -- target/conformance.txt
          echo "KUI_CONFORMANCE=$(pwd)/target/conformance.txt" >> "$GITHUB_ENV"

      # cbuild (examples/devtools/src/bin/cbuild.rs) first compiles the generated ABI asserts
      # (crates/kui-ffi/src/abi_parity.rs) against include/kui.h - the header is
      # hand-written and otherwise unchecked against the repr(C) structs -
      # and then builds the example, which is the only thing that links
      # against the real header. The C adapter needs no `conformance`
      # feature: it rebuilds the scenes through the public C API alone and
      # reads the reference as a file, so libkui_ffi here is built exactly
      # as it ships, with the corpus compiled out.
      # `--run` rather than a list of commands here: the tool owns the
      # round, prints it when it is not running it, and runs exactly what it
      # printed - so reproducing a failure locally is the line above, and
      # the two cannot drift. What it covers:
      #
      #  * C as the host, headless: the counter's own drive, and then the
      #    header walk (examples/c/tools/surface.c), which calls every
      #    prototype in kui.h once and checks what comes back.
      #  * The other direction, and the one with a linker requirement rather
      #    than only an API: a Rust host dlopens target/debug/panel.so and
      #    the plugin resolves every kui_* back out of the host executable.
      #    That works only while build.rs keeps passing --export-dynamic,
      #    which has no compile error to announce it going missing - the
      #    host builds either way and the plugin just stops loading.
      #  * C on both sides, through kui_ctx_add_extension (ADR 0014's C
      #    half).
      #  * The load the loader must refuse: the same plugin with its
      #    kui_ext_abi deleted, which is what a plugin built against a
      #    pre-ADR-0006 header looks like. It used to load unchecked
      #    (backlog S1). The unit test in ext.rs pins the message against
      #    the platform's libc; this drives the real mutant through the real
      #    host and requires the exit *and* the message, so a loader that
      #    went back to "absent = unchecked" fails rather than printing ok.
      #
      # The conformance replay is separate because it is the one thing in
      # the round that needs a report built by another step.
      - name: C examples (header ABI check + the header walk + the C round)
        run: |
          cargo run -p kui-devtools --bin cbuild -- --run
          ./target/debug/conformance target/conformance.txt

      # npm test covers both the encoder tests and the Node adapter over
      # the corpus, which needs KUI_CONFORMANCE to run (it skips without
      # it, so that the publish job - which has no cargo target dir - can
      # still run the rest against the prebuilds). A skip is green, so
      # here - the one job where the adapter is meant to run - the skip is
      # turned into a failure: without KUI_CONFORMANCE_REQUIRED the check
      # could quietly vanish (the reference step reordered, or its
      # $GITHUB_ENV export lost) and nothing would go red. The C adapter
      # needs no equivalent: it takes the path as an argument and exits 1
      # when it cannot read it.
      #
      # The `cargo build` below is what the tests load. It has to be its own
      # invocation rather than riding on the clippy/test steps above: a build
      # that also builds kui-node's tests unifies its `napi/noop`
      # dev-dependency feature into the cdylib, and what lands in
      # target/debug/ then is an addon Node refuses ("Module did not
      # self-register"). native.cjs skips such a candidate and says why, so
      # the order of these steps is no longer load-bearing - but the release
      # build still has to happen, or there is nothing good to fall back to.
      - name: Node addon tests
        env:
          KUI_CONFORMANCE_REQUIRED: "1"
        run: |
          cargo build -p kui-node --release
          cd packages/kui
          npm test
          # Three generated files: the TS prop types and docs/props.md come
          # from the schema, and index.d.ts's addon surface from the `#[napi]`
          # attributes (napi-rs derives it; the cargo build above left it in
          # target/napi-type-defs). A stale file means someone changed PROPS
          # or the addon's API without running `npm run gen`.
          npm run gen
          git diff --exit-code -- jsx-runtime.d.ts index.d.ts ../../docs/props.md

      # The .d.ts is only exercised by a type checker; the examples are
      # what uses every app-facing type (messages, events, props), and
      # examples/node/tools/types.tsx is the one written for that. Running
      # them is the headless round's, below.
      - name: Node examples typecheck
        run: |
          cd examples/node
          npm ci
          npm run typecheck

      # Every example with a self-check, run with `--headless` and judged
      # by its exit code (ADR 0021, decision 4): the Rust ones each crate's
      # Cargo.toml lists under `[package.metadata.kui] headless`, the Lua
      # and C panel hosts, and `npm run smoke` for Node - the counter
      # clicks its own buttons by label, types into its field, opens its
      # menu; the others theirs. Typechecking alone let a stale focus
      # assumption sit in the Node counter from 0.1.0-alpha.5 (a click
      # takes the keyboard, so `autofocus` no longer held when it typed)
      # without anything going red, which is what a drive with an exit
      # code is for. One program for the round on every platform
      # (examples/devtools/src/bin/smoke.rs, backlog AR4): it reads the
      # rosters the pin tests read, prints the round and runs it. The
      # windowed examples are its `--windowed` half, on a machine with a
      # display.
      - name: The headless round
        run: cargo run -p kui-devtools --bin smoke -- --headless

      # examples/node depends on packages/kui by `file:` path, so its
      # lockfile keeps a copy of that manifest version - and `npm ci` above
      # neither validates nor rewrites it. A lockfile naming a version the
      # package no longer has installs and typechecks silently, which is how
      # this one sat at alpha.2 while packages/kui reached alpha.5. Compare
      # the two files directly rather than regenerating and diffing: no npm
      # run, so no dependence on the runner npm formatting the file the same
      # way. scripts/set-version.nu writes both, so they diverge only when a
      # manifest is edited by hand.
      - name: The examples lockfile matches the linked package
        run: |
          node -e '
            const want = require("./packages/kui/package.json").version;
            const lock = "./examples/node/package-lock.json";
            const got = require(lock).packages?.["../../packages/kui"]?.version;
            if (got !== want) {
              console.error(`${lock} records ${got}, packages/kui is ${want}` +
                "\n(cd examples/node && npm install --package-lock-only)");
              process.exit(1);
            }
            console.log(`examples lockfile matches packages/kui at ${want}`);
          '

      # Everything above this line is a check; everything below is the
      # cache write, and it runs on a push only (see the restore step).
      #
      # The prune is what keeps the entry from growing without limit. The
      # cache is restored through `restore-keys`, so the target dir a run
      # starts from was built for some older Cargo.lock, and cargo removes
      # nothing an older build left behind - every release, dev-dependency
      # and stable rustc leaves another set of the workspace's artifacts
      # beside the last one. Only the workspace's own artifacts go - the
      # dependency builds, which are the reason the cache exists, stay -
      # and none of it is a loss even when current, because the steps
      # above recompile the workspace from source on every run regardless.
      # The script's header says what accumulated and how it is found; the
      # short version is that its first cut went by crate name and left
      # every test, bench and example executable behind, which is most of
      # the dir. The `v2` in the key is what put the new cut in charge:
      # the entry under the exact key is one the old cut wrote, and it
      # would have been restored as is, `cache-hit` true and this step
      # skipped, until Cargo.lock next moved. A new prefix makes the first
      # run after it a cold build that saves a pruned entry; the old
      # entries age out on their own.
      - name: Prune the target dir
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        run: nu scripts/prune-target.nu

      # `cache-hit` is the exact key, not the `restore-keys` prefix: when
      # Cargo.lock has not moved, the entry under this key is already the
      # one that would be written, and actions/cache/save refuses to
      # overwrite it anyway.
      - name: Save cargo cache
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The three cross jobs share one shape: rustup for the target, the linker
  # for the platform, a cache per target, build, collect, upload. zig and
  # cargo-zigbuild come as pip wheels (x64 and arm64 Linux), which keeps the
  # runner's own arch out of the picture.
  build-linux:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    container:
      image: node:24-bookworm
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            prebuild: linux-x64
          - target: aarch64-unknown-linux-gnu
            prebuild: linux-arm64
    env:
      CARGO_ZIGBUILD_VERSION: "0.23.3"
      ZIGLANG_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v4

      # The repository's scripts are Nushell, so one script runs on every
      # platform a workstation or runner has; the image has curl, and the
      # release tarball's nu, built for the runner's arch against glibc,
      # runs on bookworm as it is.
      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - name: Install toolchain
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3-pip \
            pkg-config libasound2-dev zstd
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain stable -t "${{ matrix.target }}"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          pip3 install --break-system-packages \
            "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" "ziglang==${ZIGLANG_VERSION}"
          cargo-zigbuild --version

      # The audio backend links ALSA; the arm64 leg cross-links against
      # Debian's arm64 multiarch copy, which pkg-config finds in cross mode.
      - name: Install arm64 ALSA
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -eu
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y --no-install-recommends libasound2-dev:arm64
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: native-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-${{ matrix.target }}-

      # The `.2.28` suffix is the glibc version zig links against; the
      # output still lands in target/<triple>/release.
      - name: Build kui-node
        run: cargo zigbuild -p kui-node --release --target "${{ matrix.target }}.2.28"

      - name: Collect prebuild
        run: nu scripts/collect-prebuild.nu "${{ matrix.target }}" "${{ matrix.prebuild }}"

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.prebuild }}
          path: packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node
          if-no-files-found: error

  build-windows:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    container:
      image: node:24-bookworm
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            prebuild: win32-x64
    env:
      XWIN_CACHE_DIR: /usr/local/xwin
      CARGO_XWIN_VERSION: "0.23.1"
    steps:
      - uses: actions/checkout@v4

      # The repository's scripts are Nushell, so one script runs on every
      # platform a workstation or runner has; the image has curl, and the
      # release tarball's nu, built for the runner's arch against glibc,
      # runs on bookworm as it is.
      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - name: Install toolchain
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl clang lld llvm zstd
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain stable -t "${{ matrix.target }}"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"

      # The cargo-xwin binary and the SDK it downloads are cached across
      # runs; the target dir is cached like the other legs.
      - name: Cache cargo-xwin and the Windows SDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/bin/cargo-xwin
            /usr/local/xwin
          key: xwin-${{ runner.os }}-${{ env.CARGO_XWIN_VERSION }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: native-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-${{ matrix.target }}-

      - name: Install cargo-xwin
        run: |
          set -eu
          if ! cargo xwin --version 2>/dev/null | grep -q "$CARGO_XWIN_VERSION"; then
            cargo install cargo-xwin --locked --version "$CARGO_XWIN_VERSION"
          fi

      - name: Build kui-node
        run: cargo xwin build -p kui-node --release --target "${{ matrix.target }}"

      - name: Collect prebuild
        run: nu scripts/collect-prebuild.nu "${{ matrix.target }}" "${{ matrix.prebuild }}"

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.prebuild }}
          path: packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node
          if-no-files-found: error

  build-macos:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    container:
      image: node:24-bookworm
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            prebuild: darwin-arm64
          - target: x86_64-apple-darwin
            prebuild: darwin-x64
    env:
      SDKROOT: /usr/local/MacOSX15.5.sdk
      MACOS_SDK_URL: https://github.com/joseluisq/macosx-sdks/releases/download/15.5/MacOSX15.5.sdk.tar.xz
      CARGO_ZIGBUILD_VERSION: "0.23.3"
      ZIGLANG_VERSION: "0.16.0"
    steps:
      - uses: actions/checkout@v4

      # The repository's scripts are Nushell, so one script runs on every
      # platform a workstation or runner has; the image has curl, and the
      # release tarball's nu, built for the runner's arch against glibc,
      # runs on bookworm as it is.
      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      # cargo-zigbuild and zig itself both come as pip wheels (x64 and
      # arm64 Linux), which keeps the runner's own arch out of the picture.
      - name: Install toolchain
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3-pip xz-utils zstd
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
            --default-toolchain stable -t "${{ matrix.target }}"
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          pip3 install --break-system-packages \
            "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" "ziglang==${ZIGLANG_VERSION}"
          cargo-zigbuild --version

      - name: Cache the macOS SDK
        uses: actions/cache@v4
        with:
          path: /usr/local/MacOSX15.5.sdk
          key: macos-sdk-15.5

      - name: Fetch the macOS SDK
        run: |
          set -eu
          if [ ! -f "$SDKROOT/SDKSettings.json" ]; then
            curl -fL --retry 3 "$MACOS_SDK_URL" | tar -xJ -C /usr/local
          fi
          test -f "$SDKROOT/SDKSettings.json"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target
          key: native-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-${{ matrix.target }}-

      - name: Build kui-node
        run: cargo zigbuild -p kui-node --release --target "${{ matrix.target }}"

      - name: Collect prebuild
        run: nu scripts/collect-prebuild.nu "${{ matrix.target }}" "${{ matrix.prebuild }}"

      - uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.prebuild }}
          path: packages/kui/prebuilds/${{ matrix.prebuild }}/kui_node.node
          if-no-files-found: error

  publish:
    needs: [check, build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: docker
    container:
      image: node:24-bookworm
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      # cargo sends the token verbatim as the Authorization header; Forgejo
      # wants the Bearer scheme in it.
      CARGO_REGISTRIES_DRYDOCK9_TOKEN: Bearer ${{ secrets.PACKAGES_TOKEN }}
      NPM_REGISTRY: ${{ github.server_url }}/api/packages/${{ github.repository_owner }}/npm/
    steps:
      - uses: actions/checkout@v4

      # The repository's scripts are Nushell, so one script runs on every
      # platform a workstation or runner has; the image has curl, and the
      # release tarball's nu, built for the runner's arch against glibc,
      # runs on bookworm as it is.
      - name: Install nu
        run: |
          set -eu
          dir="nu-${NU_VERSION}-$(uname -m)-unknown-linux-gnu"
          curl -fL --retry 3 \
            "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/${dir}.tar.gz" \
            | tar -xz -C /usr/local/bin --strip-components=1 "${dir}/nu"
          nu --version

      - name: Install toolchain
        run: |
          set -eu
          apt-get update
          # ALSA headers: the runner crate's audio backend (kira/cpal) links
          # libasound on Linux.
          apt-get install -y --no-install-recommends fonts-dejavu-core ca-certificates curl \
            pkg-config libasound2-dev zstd
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${CARGO_HOME}/bin" >> "$GITHUB_PATH"
          test -n "$PACKAGES_TOKEN" || { echo "PACKAGES_TOKEN secret is not set" >&2; exit 1; }

      # `cargo publish` verifies each crate by building the packaged tarball
      # under target/package against the registry copies of its dependencies;
      # keeping that dir and the registry cache makes later releases quick.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
            target/package
          key: publish-${{ hashFiles('Cargo.lock') }}
          restore-keys: publish-

      - name: Tag matches the manifests
        run: nu scripts/check-version.nu "${GITHUB_REF_NAME#v}"

      # Without `name`, v3 downloads every artifact of the run into
      # <path>/<artifact name>/, which is exactly the prebuilds layout.
      - uses: actions/download-artifact@v3
        with:
          path: packages/kui/prebuilds

      # No target dir exists in this job, so native.cjs must find the addon
      # under prebuilds/ - the parity tests then exercise the shipped binary.
      - name: Verify the bundled prebuilds
        run: |
          set -eu
          ls -lR packages/kui/prebuilds
          for p in linux-x64 linux-arm64 darwin-arm64 darwin-x64 win32-x64; do
            test -f "packages/kui/prebuilds/$p/kui_node.node" || { echo "missing prebuild $p" >&2; exit 1; }
          done
          cd packages/kui
          npm test
          npm pack --dry-run

      # One invocation publishes in dependency order: each crate's verify
      # build resolves the earlier ones from the freshly published index.
      - name: cargo publish
        run: cargo publish -p kui-derive -p kui-core -p kui-wgpu -p kui-native -p kui-lua -p kui-ffi --registry drydock9

      # Prereleases get their identifier as the dist-tag (0.1.0-alpha.1 ->
      # `alpha`, installed with `npm i @qxuken/kui@alpha`); plain versions become
      # `latest`. A prerelease also takes `latest` when it sorts highest among
      # the versions the registry already holds, because a registry without a
      # `latest` answers nothing: `npm view @qxuken/kui version` prints an
      # empty line and exits 0, `npm outdated` omits the package, and a bare
      # `npm install @qxuken/kui` has no version to resolve. The guard is what
      # keeps a future stable release's `latest` from being taken back by an
      # alpha published after it.
      - name: npm publish
        run: |
          set -eu
          ver=$(node -p 'require("./packages/kui/package.json").version')
          tag=latest
          case "$ver" in *-*) tag="${ver#*-}"; tag="${tag%%.*}";; esac
          printf '%s:_authToken=%s\n' "${NPM_REGISTRY#https:}" "$PACKAGES_TOKEN" > "$HOME/.npmrc"
          cd packages/kui
          npm publish --registry "$NPM_REGISTRY" --tag "$tag"
          if [ "$tag" != latest ]; then
            # Asked through the tag just written, because a plain `npm view`
            # defaults to `latest` - the tag whose absence this is fixing - and
            # against a package without one it prints nothing and succeeds. The
            # sort is npm's own semver, resolved out of npm's bundled copy so
            # nothing has to be installed for it.
            versions=$(npm view "@qxuken/kui@$tag" versions --json --registry "$NPM_REGISTRY")
            highest=$(VERSIONS="$versions" node -e '
              const root = require("node:child_process")
                .execFileSync("npm", ["root", "-g"], { encoding: "utf8" }).trim();
              const semver = require(require.resolve("semver", { paths: [root + "/npm/node_modules"] }));
              const listed = JSON.parse(process.env.VERSIONS);
              const all = (Array.isArray(listed) ? listed : [listed]).filter((v) => semver.valid(v));
              if (all.length === 0) throw new Error("no published versions to compare against");
              process.stdout.write(all.sort(semver.rcompare)[0]);
            ')
            if [ "$highest" = "$ver" ]; then
              npm dist-tag add "@qxuken/kui@$ver" latest --registry "$NPM_REGISTRY"
            else
              echo "latest left alone: $highest sorts above the $ver just published"
            fi
          fi
