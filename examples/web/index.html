<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kui counter · WebAssembly</title>
  <style>
    :root { color-scheme: light; font: 16px system-ui, sans-serif; background: #eef1f6; color: #172031; }
    body { margin: 0; }
    main { max-width: 560px; margin: clamp(24px, 8vh, 80px) auto; padding: 0 16px; }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    p { margin: 0 0 20px; color: #4b5668; }
    canvas { display: block; width: 100%; height: 400px; border-radius: 12px; touch-action: manipulation; box-shadow: 0 0 0 1px #cdd4e0, 0 8px 24px #17203112; }
    #status { margin-top: 16px; }
    [data-embed] main { max-width: none; margin: 0; padding: 0; }
    [data-embed] main > :not(canvas):not(.workbench) { display: none; }
    [data-embed] canvas { height: 100dvh; border-radius: 0; box-shadow: none; }
  </style>
</head>
<body>
  <main>
    <h1>kui in the browser</h1>
    <p>Rust counter · WebAssembly · <span id="renderer">choosing renderer</span></p>
    <canvas aria-label="kui counter" tabindex="0"></canvas>
    <p id="status" role="status">Loading the counter…</p>
    <p style="margin-top: 16px"><a href="./notes.html">Try the notes workspace</a></p>
  </main>
  <script type="module">
    import { mountDemo } from "./mount.js";
    await mountDemo("./counter.wasm");
  </script>
</body>
</html>
