[package]
name = "kui-devtools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The devtools every kui example runs inside: a dock with an event stream and a tree inspector, a CLI and a headless drive (docs/adr/0021)"
# Development scaffolding for this repository's examples, not a library:
# it is a dev-dependency of the crates whose examples use it and nothing
# else, and it never goes to a registry.
publish = false

[dependencies]
kui.workspace = true
# For `cbuild` on Windows: the registry lookup that finds `cl.exe` and its
# environment, the same one every `-sys` crate uses. Already in the tree.
cc = "1"
