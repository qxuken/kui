[package]
name = "kui-book-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
rust-wgpu = ["kui-web/rust-wgpu", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
kui-core = { workspace = true, features = ["derive", "svg", "devtools"] }
kui-web.workspace = true
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
js-sys = { version = "0.3.106", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }
wasm-bindgen-futures = { version = "0.4.79", optional = true }
web-sys = { version = "0.3.106", optional = true, features = ["HtmlCanvasElement"] }

[target.'cfg(target_os = "wasi")'.dependencies]
kui-kit.workspace = true
kui-lua.workspace = true
mlua = { workspace = true, features = ["serde"] }
