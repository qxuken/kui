<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kui book example</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0e1015; color: #e8e8ea; font: 16px system-ui, sans-serif; }
    main { position: relative; }
    :root:not([data-embed]) body:has(.popup-overlay:not([hidden])) { overflow-y: auto; }
    .popup-overlay { position: absolute; z-index: 1; box-shadow: 0 8px 24px #0006; }
    canvas { display: block; width: 100%; height: 100%; touch-action: pinch-zoom; }
    :is(#access,.popup-access) { position: absolute; inset: 0; overflow: hidden; opacity: 0; pointer-events: none; }
    :is(#access,.popup-access) :is(button,textarea,input) { position: absolute; font: 16px system-ui, sans-serif; margin: 0; padding: 0; border: 0; resize: none; }
    #status { position: absolute; top: 1rem; left: 1rem; }
    [data-embed] #status { display: none; }
  </style>
</head>
<body>
  <main>
    <canvas aria-label="kui book example" tabindex="0"></canvas>
    <div id="access" role="group" aria-label="kui book example"></div>
    <p id="status" role="status">Loading example…</p>
    <span id="renderer" hidden></span>
  </main>
  <script type="module">
    import { mountDemo } from "./mount.js";
    import { effects } from "./gallery-effects.js";
    const example = new URLSearchParams(location.search).get("example") ?? "";
    const bytes = new TextEncoder().encode(example);
    const requiresGpu = ["widgets/fragment", "widgets/line", "features/backdrop_blur"].includes(example);
    const hasLua = example === "tutorial/11_extensions" || example === "lua/presentations";
    let lua;
    const main = document.querySelector("main");
    const owner = main.querySelector("canvas");
    const popup = example === "features/popup"
      ? (await import("./gallery-popup.js")).createPopup(main, owner, () => scale)
      : undefined;
    const runEffects = effects({
      audioEnabled: example === "features/audio",
      contentScale: () => scale,
      popupOpen: () => !!popup?.open,
    });
    let minWidth = 1;
    let dockHeight;
    let popupBottom = 0;
    let reportedHeight;
    let wired = false;
    const embedded = window.parent !== window;
    const reportSize = (wasm) => {
      if (!embedded && !popup) return;
      const dock = wasm.demo_devtools_height();
      const ownerHeight = wasm.demo_height() + dock;
      const height = Math.max(ownerHeight, popupBottom);
      if (popup && dock !== dockHeight) {
        owner.style.height = `${ownerHeight}px`;
        main.querySelector("#access").style.height = `${ownerHeight}px`;
      }
      if (popup) main.style.minHeight = `${height}px`;
      if (embedded && (height !== reportedHeight || dock !== dockHeight)) {
        window.parent.postMessage({
          type: "kui-example", state: "size",
          width: wasm.demo_width(), minWidth, height,
          devtools: dock > 0,
        }, location.origin);
      }
      dockHeight = dock;
      reportedHeight = height;
    };
    let scale = 1;
    function fit() {
      scale = Math.min(1, Math.max(innerWidth, 1) / minWidth);
      main.style.zoom = scale;
      main.style.width = `${innerWidth / scale}px`;
      main.style.height = `${innerHeight / scale}px`;
    }
    window.addEventListener("resize", fit);
    fit();
    await mountDemo(hasLua ? "./gallery-lua.wasm" : "./gallery.wasm", {
      renderer: requiresGpu ? "wgpu" : "auto",
      contentScale: () => scale,
      overlayCanvas: popup?.canvas,
      panOutside: dy => window.parent.postMessage({
        type: "kui-example", state: "pan", dy,
      }, location.origin),
      instantiate: hasLua ? async (bytes, imports) => {
        lua = (await import("./gallery-lua.js")).luaHost();
        return lua.instantiate(bytes, imports);
      } : undefined,
      initialize(wasm) {
        const ptr = wasm.text_buffer(bytes.length);
        new Uint8Array(wasm.memory.buffer, ptr, bytes.length).set(bytes);
        const error = wasm.select_example();
        if (error) {
          const message = new Uint8Array(wasm.memory.buffer, wasm.text_buffer(error), error);
          throw new Error(new TextDecoder().decode(message));
        }
        minWidth = wasm.demo_min_width();
        reportSize(wasm);
        fit();
      },
      afterFrame(wasm, canvas, schedule, drawOverlay) {
        if (embedded && !wired) {
          wired = true;
          window.addEventListener("message", event => {
            if (event.origin !== location.origin || event.source !== window.parent ||
                event.data?.type !== "kui-example" || event.data.state !== "devtools") return;
            wasm.demo_set_devtools(Number(event.data.on === true));
            reportSize(wasm);
            schedule();
          });
        }
        if (popup) popupBottom = popup.afterFrame(wasm, schedule, drawOverlay);
        reportSize(wasm);
        runEffects(wasm, canvas, schedule);
        lua?.afterFrame(wasm, canvas, schedule);
      },
    });
  </script>
</body>
</html>
