[book]
title = "The kui book"
description = "A first path through kui, one concept per chapter, each chapter a program in examples/rust/tutorial."
authors = ["The kui authors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-js = ["live-example.js"]
additional-css = ["live-example.css"]

[output.html.fold]
enable = false
