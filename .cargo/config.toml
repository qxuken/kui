# The Forgejo cargo registry the kui crates publish to (`publish = ["forgejo"]`
# in each manifest). Consumers add the same table to their own config and
# depend on `kui-native = { version = "...", registry = "forgejo" }`. Publishing needs
# a token: `cargo login --registry forgejo` and paste `Bearer <token>` (a
# personal access token with write:packages), or set
# CARGO_REGISTRIES_FORGEJO_TOKEN="Bearer <token>" as CI does.
[registries.forgejo]
index = "sparse+https://drydock9.qxuken.dev/api/packages/qxuken/cargo/"
